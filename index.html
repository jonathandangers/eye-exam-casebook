function stepChip(k, note){
  const i = TILES.findIndex(t=>t.k===k);
  return `<a class="stepchip" href="#/exam/${k}"><span class="rn">${i+1}</span><span>${TILES[i].name}${note?`<small>${note}</small>`:""}</span></a>`;
}

function dxHTML(d){
  const img = d.img ? `<figure class="dx-fig"><img src="${IMG[d.img.src]}" alt="${esc(d.img.cap)}"><figcaption>${d.img.cap}</figcaption></figure>` : "";
  const cmp = d.compare ? `<div class="compare">${d.compare.map(([k,v])=>`<div><span class="k">${k}</span><span class="v">${v}</span></div>`).join("")}</div>` : "";
  const secHTML = ([h,items])=>`<div class="dx-sec"><p class="blk-h">${h}</p><ul>${items.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  const isWhat = x=>x[0]==="What it is";
  const what = d.sec.filter(isWhat).map(secHTML).join("");
  const secs = d.sec.filter(x=>!isWhat(x)).map(secHTML).join("");
  const seq = d.seq ? `<div class="callout tip"><span class="ch">${d.seq.h}</span><ol class="seq">${d.seq.items.map(x=>`<li>${x}</li>`).join("")}</ol></div>` : "";
  const after = d.after ? `<p class="dx-after">${d.after}</p>` : "";
  const steps = d.steps ? `<div class="review"><span>Exam steps:</span>${d.steps.map(k=>{const i=TILES.findIndex(t=>t.k===k); return `<a href="#/exam/${k}"><span class="rn">${i+1}</span>${TILES[i].name}</a>`;}).join("")}</div>` : "";
  return `<details class="dx" id="dx-${d.id}">
    <summary><span class="dx-name">${d.name}</span><span class="dx-bl">${d.bl}</span><span class="dx-tog" aria-hidden="true"></span></summary>
    <div class="dx-body">${what}${d.lead||""}${cmp}${img}${secs}${seq}${after}${d.extraHTML||""}${steps}</div>
  </details>`;
}

const AP_REFS = [
  ["Chou B, Shah SM, Kalavar M, et al. Trends in utilization of imaging among ophthalmic-related emergency department visits in the United States. Front Ophthalmol. 2026;5:1706213.","https://doi.org/10.3389/fopht.2025.1706213"],
  ["Rabin E, Patrick L. Specialist availability in emergencies: contributions of response times and the use of ad hoc coverage in New York State. Am J Emerg Med. 2016;34(4):687-693.","https://doi.org/10.1016/j.ajem.2015.12.059"]
];

function approachPage(){
  const sections = [["a-hard","Why it’s hard"],["a-why","Why learn it"],["a-sort","Sort"],["a-exam","Exam"]];
  const dots = TILES.map((t,i)=>`<span title="${t.name}">${i+1}</span>`).join("");
  const bins = BINS.map(b=>{
    const L = LEARN[b.t], tc = TRACKS[b.t].color;
    return `<div class="bin" style="--tc:${tc}">
      <h3>${L.title}</h3>
      <p class="first"><b>First question</b>${b.first}</p>
      <p class="cm">Can’t miss</p>
      <div class="dxs">${b.dx.map(id=>`<a href="#/learn/${b.t}/${id}">${SHORT[id]}</a>`).join("")}</div>
      <a class="bigbtn" href="#/learn/${b.t}">Open the ${b.label} guide</a>
    </div>`;}).join("");
  app.innerHTML = `
  <div class="exbar">
    <div class="topbar"><a class="back" href="#/">← Home</a><span class="where"><a href="#/exam">8-point exam</a> · <a href="#/cases">Cases</a></span></div>
    <nav class="rail" aria-label="Sections">${sections.map(([id,l])=>`<a href="#${id}" data-jump="${id}" class="plain">${l}</a>`).join("")}</nav>
  </div>
  <header class="ex-head ap-head">
    <h1>Approach to an eye complaint</h1>
  </header>

  <section class="part" id="a-hard">
    <h2>Why this feels so difficult</h2>
    <div class="why-grid">
      <figure><img src="${IMG.why}" alt="Illustration of an overwhelmed physician surrounded by scattered eye diagrams and eye charts"><figcaption>Illustration generated with Gemini.</figcaption></figure>
      <div>
        <p>Eye complaints feel hard when they live in your head as a loose list: CRAO, keratitis, open globe, uveitis, GCA, angle closure, and on and on. That list is hard to use at 2 a.m. when the patient says “I can’t see” or “my eye hurts.”</p>
        <p>The fix isn’t memorizing more. It’s a way to sort the complaint and a reproducible exam.</p>
      </div>
    </div>
  </section>

  <section class="part" id="a-why">
    <h2>Why this is worth getting good at</h2>
    <div class="reasons">
      <div><b>They come to the ED</b><span>Eye complaints are a routine part of ED volume: about 6 million US visits a year.<sup><a href="#a-refs" data-jump="a-refs">1</a></sup> The time-sensitive ones, like a chemical splash, an open globe, or a retinal artery occlusion, don’t wait for clinic hours.</span></div>
      <div><b>Few others are trained to examine the eye</b><span>Few clinicians outside ophthalmology are trained to examine the eye, and ophthalmology generally isn’t immediately available to see ED patients outside academic centers.<sup><a href="#a-refs" data-jump="a-refs">2</a></sup> Your exam is often what the consultant acts on over the phone.</span></div>
      <div><b>It’s learnable</b><span>You don’t need to become an ophthalmologist. You need a way to sort the complaint, the 8-point exam, and the handful of time-sensitive actions. Then look up the rest.</span></div>
    </div>
  </section>

  <section class="part" id="a-sort">
    <h2>Sort the complaint</h2>
    <p class="lead-in">Sort by the presenting complaint, not the final diagnosis. It usually sorts itself at triage or in the first sentence of the history. Each of the three presentations has its own first question and a short list of can’t-miss diagnoses, which narrows the differential.</p>
    <div class="bins">${bins}</div>
    <div class="callout tip"><span class="ch">These are presentations, not separate groups of diseases</span>
      <ul><li>Go by the main complaint. Patients and diagnoses can fit more than one.</li>
      <li>Any trauma or chemical exposure: start in <b>Trauma</b>.</li>
      <li>A painful red eye with vision loss (angle closure, keratitis, endophthalmitis) starts in <b>Painful / red eye</b>.</li>
      <li>Optic neuritis hurts with eye movement and GCA comes with headache, but both are under <b>Vision loss</b>, because that’s usually the lead complaint.</li>
      <li>It isn’t a rigid tree. The point is to stop trying to remember every diagnosis at once.</li></ul></div>
  </section>

  <section class="part" id="a-exam">
    <h2>Actually do the 8-point exam</h2>
    <p class="lead-in">Do the full exam whenever you can. It catches what the history hides: a field cut behind normal acuity, an RAPD, a peaked pupil. It also makes your call to ophthalmology more useful.</p>
    <a class="route exam-card" href="#/exam">
      <h2>The 8-point exam</h2>
      <p>How to do each step, what it catches, and when to skip it.</p>
      <div class="dots" aria-hidden="true">${dots}</div>
      <span class="go">Open the exam guide</span>
    </a>
  </section>

  <details class="refs" id="a-refs"><summary>References</summary><ol>${AP_REFS.map(([t,u])=>`<li>${esc(t)} <a href="${u}" target="_blank" rel="noopener">Link</a></li>`).join("")}</ol></details>
  <footer class="foot"><span><a class="textlink" href="#/terms">Abbreviations and terms</a></span><span>Anonymous usage is counted. No cookies or personal identifiers.</span><span>Jonathan Dangers, MD, MPH.</span><span>Clinical teaching material. Follow local protocols and consultant guidance.</span></footer>`;

  app.querySelectorAll("[data-jump]").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();
    if(a.dataset.jump==="a-refs") document.getElementById("a-refs").open=true;
    jumpTo(a.dataset.jump);}));
  const links=[...app.querySelectorAll(".rail a")], rail=app.querySelector(".rail");
  const parts=[...app.querySelectorAll(".part")]; let cur=null;
  const spy=()=>{
    let id=parts[0].id; for(const p of parts){ if(p.getBoundingClientRect().top < 170) id=p.id; }
    if(id===cur) return; cur=id;
    links.forEach(l=>{ const on=l.dataset.jump===id; l.classList.toggle("on",on);
      if(on) rail.scrollTo({left:l.offsetLeft-rail.clientWidth/2+l.clientWidth/2}); });
  };
  window.addEventListener("scroll",spy,{passive:true}); spy();
  railObs = {disconnect(){ window.removeEventListener("scroll",spy); }};
  window.scrollTo(0,0);
}

route();
</script>
<script>
window.goatcounter = {no_onload:true};
function gcCount(){ if(window.goatcounter.count) window.goatcounter.count({path:location.pathname+(location.hash||"#/")}); }
window.addEventListener("hashchange",gcCount);
</script>
<script data-goatcounter="https://eye-emergencies.goatcounter.com/count" async src="https://gc.zgo.at/count.js" onload="gcCount()"></script>

</body>
</html>
