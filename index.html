<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Jonathan Dangers, MD, MPH">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Eye Emergencies Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,650;1,6..72,500&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --ground:#F5EFE3; --surface:#FFFBF3; --surface-2:#EFE6D4; --ink:#2B2520; --muted:#6E6254; --line:#DCCFB8;
  --accent:#3E5566; --accent-ink:#FFFFFF;
  --vision:#1F6F78; --redeye:#A83A5A; --trauma:#875A0E;
  --good:#2E7555; --good-bg:#E4F0E8; --bad:#A12D2D; --bad-bg:#F7E3DF; --warn:#8A5A00; --warn-bg:#F6EBD2;
  --shadow:0 1px 0 rgba(60,40,20,.06),0 6px 18px -10px rgba(60,40,20,.25);
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#1B1916; --surface:#25221E; --surface-2:#2F2B26; --ink:#EEE6D8; --muted:#B3A795; --line:#403A32;
    --accent:#8FB0C6; --accent-ink:#14191D;
    --vision:#6CC3CC; --redeye:#E07B9A; --trauma:#E2A845;
    --good:#7CC7A0; --good-bg:#1F3329; --bad:#F08A7E; --bad-bg:#3A2320; --warn:#E6B65C; --warn-bg:#352B18;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#1B1916; --surface:#25221E; --surface-2:#2F2B26; --ink:#EEE6D8; --muted:#B3A795; --line:#403A32;
  --accent:#8FB0C6; --accent-ink:#14191D;
  --vision:#6CC3CC; --redeye:#E07B9A; --trauma:#E2A845;
  --good:#7CC7A0; --good-bg:#1F3329; --bad:#F08A7E; --bad-bg:#3A2320; --warn:#E6B65C; --warn-bg:#352B18;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 96px}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--serif);font-weight:650;text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--muted)}

/* Home */
.masthead{padding-block:28px 8px;display:grid;gap:10px}
.chart{font-family:var(--mono);font-weight:600;color:var(--muted);letter-spacing:.35em;line-height:1.05;user-select:none}
.chart span{display:block}
.chart .l1{font-size:40px;color:var(--ink)} .chart .l2{font-size:24px} .chart .l3{font-size:15px}
.masthead h1{font-size:clamp(34px,7vw,50px)}
.lede{max-width:60ch;color:var(--ink);margin:0}
.byline{margin:-4px 0 4px;font-family:var(--serif);font-style:italic;font-size:18px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow)}
.how{display:grid;gap:12px;margin-block:18px}
.order{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none;counter-reset:o}
.order li{counter-increment:o;font-size:13px;background:var(--surface-2);border-radius:999px;padding:3px 10px 3px 6px;display:flex;gap:6px;align-items:center}
.order li::before{content:counter(o);font-family:var(--mono);font-size:11px;background:var(--ink);color:var(--ground);border-radius:999px;width:18px;height:18px;display:grid;place-items:center}
.how p{margin:0;max-width:65ch}
.track{margin-block:26px 0;display:grid;gap:10px}
.track-head{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--tc);padding-bottom:6px}
.track-head h2{font-size:22px;color:var(--ink)}
.track-head .eyebrow{color:var(--tc)}
.cases{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.case-card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px;display:grid;gap:6px;align-content:start;position:relative;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.case-card:hover{transform:translateY(-2px);border-color:var(--tc)}
.case-card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.case-card .num{font-family:var(--mono);font-size:12px;color:var(--tc);font-weight:600}
.case-card .cc{font-family:var(--serif);font-size:19px;line-height:1.2;font-weight:500}
.case-card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.chip{font-size:11.5px;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chip.senior{background:var(--ink);color:var(--ground)}
.chip.done{background:var(--good-bg);color:var(--good)}
.foot{margin-top:34px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:4px}

/* Case */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);display:flex;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--line)}
.back{all:unset;cursor:pointer;font-weight:600;font-size:14px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.back:focus-visible{outline:3px solid var(--accent)}
.topbar .where{font-size:13px;color:var(--muted);margin-left:auto;text-align:right}
.case-head{padding-block:18px 10px;display:grid;gap:8px}
.case-head .eyebrow{color:var(--tc)}
.case-head h2{font-size:clamp(26px,5.5vw,34px)}
.triage{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--tc);border-radius:8px;padding:14px 16px;box-shadow:var(--shadow)}
.triage .eyebrow{margin-bottom:4px}
.triage p{margin:0;max-width:65ch}
.row-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-block:16px 6px}
.stroke{all:unset;box-sizing:border-box;cursor:pointer;font-weight:700;font-size:14px;padding:8px 14px;border-radius:8px;background:var(--surface);color:var(--bad);border:2px solid var(--bad);display:inline-flex;gap:8px;align-items:center}
.stroke:hover:not([disabled]){background:var(--bad-bg)}
.stroke[disabled]{opacity:.55;cursor:default}
.stroke:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.note{font-size:14px;padding:10px 12px;border-radius:8px;background:var(--surface-2);max-width:65ch}
.note.bad{background:var(--bad-bg);color:var(--ink);border-left:4px solid var(--bad)}
.note.warn{background:var(--warn-bg);border-left:4px solid var(--warn)}
.note.good{background:var(--good-bg);border-left:4px solid var(--good)}
.section-label{display:flex;justify-content:space-between;align-items:baseline;margin-block:18px 8px;gap:12px}
.section-label h3{font-size:19px}
.count{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:639px){.tiles{grid-auto-flow:dense}.tile.open{grid-column:1/-1}}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px;align-content:start;min-height:84px;box-shadow:var(--shadow);transition:border-color .15s ease,background .15s ease}
.tile:hover:not([aria-disabled="true"]){border-color:var(--accent)}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tile .t-top{display:flex;gap:8px;align-items:baseline}
.tile .t-n{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted)}
.tile .t-name{font-weight:700;font-size:15px}
.tile .t-sub{font-size:12.5px;color:var(--muted)}
.tile.open{cursor:default;background:var(--surface);border-color:var(--ink)}
.tile.open .t-sub{display:none}
.tile .finding{font-size:14.5px;line-height:1.45}
.tile .finding b{font-weight:700}
.tile.harm{border-color:var(--bad);background:var(--bad-bg)}
.tile[aria-disabled="true"]:not(.open){opacity:.45;cursor:not-allowed}
.tile img{border-radius:6px;display:block;width:100%;height:auto;margin-top:4px}
.tile .mini{all:unset;cursor:pointer;font-size:13px;font-weight:700;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);justify-self:start}
.tile .mini:focus-visible{outline:3px solid var(--accent)}
.checkin{margin-block:12px;background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:14px;display:grid;gap:10px}
.checkin p{margin:0;font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{all:unset;cursor:pointer;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2)}
.pill:focus-visible{outline:3px solid var(--accent)}
.pill.ghost{background:transparent;color:var(--muted)}
.callbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 20px -14px rgba(0,0,0,.35)}
.callbar .inner{max-width:760px;margin:0 auto;display:flex;gap:12px;align-items:center}
.callbar .inner span{font-size:13px;color:var(--muted)}
.primary{all:unset;box-sizing:border-box;cursor:pointer;margin-left:auto;flex:none;white-space:nowrap;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:11px 18px;border-radius:9px;text-align:center}
.primary[disabled]{opacity:.45;cursor:default}
.primary:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.q{margin-block:18px;display:grid;gap:10px}
.q h3{font-size:19px}
.opts{display:grid;gap:8px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 14px;display:flex;gap:10px;align-items:flex-start;font-size:15px}
.opt .k{font-family:var(--mono);font-weight:600;color:var(--muted);min-width:1.2em}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.dim{opacity:.6}
.debrief{margin-block:24px;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--tc);border-radius:10px;padding:18px;display:grid;gap:14px;box-shadow:var(--shadow)}
.debrief h3{font-size:24px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checks li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.mark{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;margin-top:1px}
.mark.ok{background:var(--good)} .mark.no{background:var(--bad)} .mark.mid{background:var(--warn)}
:root[data-theme="dark"] .mark{color:#1B1916}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mark{color:#1B1916}}
.teach p{margin:0 0 8px;max-width:65ch}
.teach .lbl{font-weight:700}
.debrief figure{margin:0;display:grid;gap:6px}
.debrief figure img{border-radius:8px;border:1px solid var(--line);max-width:100%;height:auto}
.debrief figcaption{font-size:13px;color:var(--muted)}
.src{font-size:13px;color:var(--muted)}
.next-row{display:flex;gap:10px;flex-wrap:wrap}
.secondary{all:unset;cursor:pointer;font-weight:600;padding:10px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2)}
.secondary:focus-visible{outline:3px solid var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@keyframes reveal{from{opacity:.35;transform:translateY(3px)}to{opacity:1;transform:none}}
.tile.fresh .finding,.q.fresh,.debrief.fresh{animation:reveal .25s ease-out}

/* ---------- Shared additions ---------- */
:root{--stop:#962626;--stop-ink:#FFFFFF;--stop-soft:rgba(255,255,255,.12)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--stop:#5E1F1B;--stop-ink:#FBE9E6;--stop-soft:rgba(255,255,255,.07)}}
:root[data-theme="dark"]{--stop:#5E1F1B;--stop-ink:#FBE9E6;--stop-soft:rgba(255,255,255,.07)}
.textlink{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}
.topbar a.back{text-decoration:none;color:var(--ink)}
.topbar .where a{color:var(--accent);font-weight:700;text-decoration:none}

/* ---------- Hub ---------- */
.hub-routes{display:grid;gap:14px;margin-block:22px 4px}
@media (min-width:640px){.hub-routes{grid-template-columns:1fr 1fr}}
.route{box-sizing:border-box;text-decoration:none;color:var(--ink);display:grid;gap:14px;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);transition:border-color .15s ease}
.route:hover{border-color:var(--ink)}
.route:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.route h2{font-size:30px}
.route p{margin:0;color:var(--muted);max-width:40ch}
.route .go{justify-self:start;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:10px 16px;border-radius:9px;margin-top:2px}
.tm-list{display:grid;gap:6px}
.tm{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600;padding:6px 10px;border-left:5px solid var(--tc);background:var(--surface-2);border-radius:0 6px 6px 0}
.tm span:last-child{font-family:var(--mono);font-weight:600;color:var(--tc)}
.dots{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;max-width:250px}
.dots span{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.dots span.dev{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.dots-key{font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.dots-key i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ink);margin-right:6px;vertical-align:-1px}
.dots-key i.dev{background:transparent;box-shadow:inset 0 0 0 2px var(--ink)}

/* ---------- Cases page header ---------- */
.cases-head{padding-block:18px 0;display:grid;gap:8px}
.cases-head h1{font-size:clamp(30px,6vw,40px)}

/* ---------- Exam page ---------- */
.exbar{position:sticky;top:0;z-index:5;background:var(--ground);margin-inline:-16px;padding:env(safe-area-inset-top,0px) 16px 0;border-bottom:1px solid var(--line)}
.exbar .topbar{position:static;border-bottom:0;padding-bottom:6px}
.rail{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.rail a{flex:none;text-decoration:none;color:var(--ink);font-size:13px;font-weight:600;padding:4px 11px 4px 4px;border-radius:999px;background:var(--surface-2);display:flex;gap:6px;align-items:center;white-space:nowrap}
.rail a.plain{padding-left:11px}
.rail a .rn{font-family:var(--mono);font-size:11px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--ground)}
.rail a.dev .rn{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.rail a.on{background:var(--accent);color:var(--accent-ink)}
.rail a.on .rn{background:var(--accent-ink);color:var(--accent);box-shadow:none}
.rail .sep{flex:none;width:1px;background:var(--line);margin-inline:3px}
.ex-head{padding-block:24px 4px;display:grid;gap:14px}
.ex-head h1{font-size:clamp(34px,7.5vw,50px)}
.frame{font-family:var(--serif);font-size:clamp(24px,5vw,30px);line-height:1.2;font-weight:500;margin:0;max-width:24ch;padding-left:16px;border-left:5px solid var(--accent)}
.frame-sub{margin:0;color:var(--muted);max-width:58ch}
.ex-order{display:grid;gap:0;margin:4px 0 0;padding:0;list-style:none;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
@media (min-width:560px){.ex-order{grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(4,auto)}}
.ex-order a{display:flex;gap:12px;align-items:center;padding:10px 14px;text-decoration:none;color:var(--ink);border-top:1px solid var(--line);font-weight:600}
.ex-order li:first-child a{border-top:0}
@media (min-width:560px){.ex-order li:nth-child(5) a{border-top:0}.ex-order li:nth-child(n+5){border-left:1px solid var(--line)}}
.ex-order a:hover{background:var(--surface-2)}
.ex-order .rn{font-family:var(--mono);font-size:13px;width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--ground)}
.ex-order li.dev .rn{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.ex-order small{display:block;font-weight:400;color:var(--muted);font-size:13px}

.stopblock{margin-block:26px 0;scroll-margin-top:120px;border-radius:14px;background:var(--stop);color:var(--stop-ink);padding:20px 18px;display:grid;gap:14px}
.stopblock h2{font-size:clamp(24px,5vw,30px);color:var(--stop-ink)}
.stopblock > p{margin:0;opacity:.92}
.stopgrid{display:grid;gap:10px}
@media (min-width:640px){.stopgrid{grid-template-columns:repeat(3,1fr)}}
.stopitem{background:var(--stop-soft);border-radius:10px;padding:12px 14px;display:grid;gap:4px}
.stopitem b{font-size:16px}
.stopitem span{font-size:14.5px;opacity:.95}

.step{margin-top:44px;scroll-margin-top:118px;display:grid;gap:16px}
.step-head{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:10px}
.step-num{font-family:var(--serif);font-size:68px;line-height:.78;font-weight:650;color:var(--accent);font-variant-numeric:lining-nums}
.step-head h2{font-size:clamp(25px,5.5vw,32px)}
.step-tag{font-size:14.5px;color:var(--muted);margin-top:3px}
.why{font-family:var(--serif);font-size:19px;line-height:1.5;margin:0;max-width:58ch}
.blk{display:grid;gap:8px}
.blk-h{font-weight:700;font-size:15px;color:var(--accent);margin:0}
.dolist{list-style:none;padding:0;margin:0;display:grid;gap:7px;max-width:62ch}
.dolist li{position:relative;padding-left:28px}
.dolist li::before{content:"";position:absolute;left:4px;top:.62em;width:12px;height:4px;border-radius:2px;background:var(--accent)}
.dolist li b{font-weight:700}
.catches{display:flex;flex-wrap:wrap;gap:6px}
.catches span{font-size:13.5px;padding:3px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface)}
.callout{border-radius:10px;padding:12px 14px;display:grid;gap:5px;font-size:15px;max-width:64ch}
.callout .ch{font-weight:700;font-size:14.5px}
.callout ul{margin:2px 0 0;padding-left:18px;display:grid;gap:4px}
.callout.pit{background:var(--warn-bg);border-left:5px solid var(--warn)}
.callout.pit .ch{color:var(--warn)}
.callout.stop{background:var(--bad-bg);border-left:5px solid var(--bad)}
.callout.stop .ch{color:var(--bad)}
.callout.tip{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent)}
.callout.tip .ch{color:var(--accent)}
.map{display:grid;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.map .r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
.map .r + .r{border-top:1px solid var(--line)}
.map .r > *{padding:9px 12px;font-size:14.5px}

  teach:"Same-side field loss in both eyes means the problem is in the brain, not the eye. That’s what decides the action: stroke activation, not an ophthalmology consult. Patients often describe a right-field cut as “my right eye.” Normal acuity does not rule out a stroke, and you only find this with fields.",

},
{ id:2, track:"vision", level:"Core", cc:"“Vision went black, then came back”",

    {q:"Best next step?", o:["Discharge with ophthalmology follow-up, since the exam is normal","Engage the stroke/TIA pathway per local protocol, with carotid and cardiac workup","Aspirin and discharge without imaging","MRI of the orbits","Reassure; symptoms resolved"], a:1,

    {q:"On re-questioning, he now remembers his jaw aches when he chews steak, and his scalp is tender when he brushes his hair. What changes?", o:["Nothing; finish the TIA workup first","Start high-dose steroids now, send ESR and CRP, and involve ophthalmology; don’t wait for biopsy","Outpatient temporal artery biopsy before any treatment","NSAIDs for the jaw pain"], a:1, senior:true,

  teach:"Resolved symptoms don’t mean a resolved problem. The exam is usually normal, so the history carries the diagnosis. GCA belongs on the differential for the cause of amaurosis, alongside carotid and cardiac emboli. In anyone over 50, ask the GCA questions every time."
},
{ id:3, track:"vision", level:"Core", cc:"“Flashes and floaters”",
  triage:"58-year-old woman, very nearsighted since childhood, with right cataract surgery 6 months ago. Two days of flashing lights and a shower of new floaters in the right eye. No curtain or shadow that she’s noticed. No pain, no trauma.",
  f:{ va:"OD 20/30, OS 20/20.",
      pupils:"Equal, round, reactive. No RAPD.",
      vf:"OD: misses fingers in the <b>lower outer quadrant</b>, which she hadn’t noticed. OS: full.",

      ext:"White and quiet. No trauma.",
      iop:"OD 12, OS 15.",
      slit:"White light: clear cornea, quiet anterior chamber, lens implant in place. Cobalt blue: no uptake.",
      fundus:"Red reflex present. Undilated view too limited to see the periphery. <b>POCUS:</b> bright, wavy membrane in the upper back of the eye, anchored at the optic disc, flapping with eye movement." },
  fimg:{fundus:{src:"rd", alt:"Ocular ultrasound showing a bright detached retinal membrane"}},
  hinge:["vf","fundus"],
  stroke:{role:"no", msg:"The stroke team reviews and declines: two days of flashes and floaters with a quadrant field cut in one eye point to the retina, not a stroke. Keep examining the eye."},
  qs:[
    {q:"Most likely diagnosis?", o:["Posterior vitreous detachment alone","Vitreous hemorrhage","Retinal detachment","Central retinal artery occlusion","Migraine aura"], a:2,
     fb:{0:"Flashes and floaters fit a vitreous detachment, but a field cut and a tethered membrane on ultrasound don’t. Call it a PVD only after you’ve looked for a tear or detachment.",
         1:"That causes haze and a dim red reflex. It doesn’t explain a quadrant field cut or a membrane tethered at the disc.",
         2:"A field cut plus a bright membrane tethered at the optic disc means detachment.",
         3:"That causes sudden, profound loss. Her central vision is still 20/30.",
         4:"Aura is usually in both eyes and resolves within an hour. It doesn’t leave a fixed field cut or a membrane on ultrasound."}},
    {q:"Best next step?", o:["Outpatient ophthalmology next week","Consult ophthalmology now for evaluation in the ED","Discharge if a repeat ultrasound is negative","Activate the stroke team","Start oral steroids"], a:1,
     why:"Central vision is still good, and that’s the vision at stake."}
  ],
  teach:"New flashes and floaters alone can already be a detachment, so don’t wait for the curtain. Her central vision is still good, which is exactly why it’s urgent: that’s the vision at stake. Patients often don’t notice a peripheral field cut until you test for it. A negative ED ultrasound doesn’t rule it out if the story fits.",
  pearl:"On ultrasound, a detached retina stays tethered to the optic disc. A vitreous detachment moves more freely and isn’t anchored there."
},

/* ---------- state ---------- */
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
let results = store.get("eyecb-results-v2", {});
let S = null; // current case session
const SAVED = {}; // in-progress and finished cases, kept for this visit
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LETTERS = "ABCDE";

function casesHome(){
  S = null;
  const groups = ["vision","redeye","trauma"].map(t=>{
    const cs = CASES.filter(c=>c.track===t);
    return `<section class="track" style="--tc:${TRACKS[t].color}">
      <div class="track-head"><h2>${TRACKS[t].name}</h2><span class="eyebrow">${cs.length} cases</span>${LEARN[t]&&!LEARN[t].soon?`<a class="textlink tguide" href="#/learn/${t}">Read the guide</a>`:""}</div>
      <div class="cases">${cs.map(c=>{
        const r = results[c.id];
        return `<button class="case-card" data-case="${c.id}" style="--tc:${TRACKS[t].color}">
          <span class="num">CASE ${c.id}</span>
          <span class="cc">${c.cc}</span>
          <span class="meta">${c.level==="Senior bonus"?'<span class="chip senior">Senior bonus</span>':'<span class="chip">Core</span>'}${r?`<span class="chip done">Done · ${r.right}/${r.total}</span>`:""}</span>
        </button>`;}).join("")}</div>
    </section>`;
  }).join("");
  app.innerHTML = `
  <div class="topbar"><a class="back" href="#/">← Home</a><span class="where"><a href="#/exam">8-point exam</a></span></div>
  <header class="cases-head">
    <h1>Interactive Cases</h1>
    <p class="lede">${CASES.length} ED patients. Examine each eye one part at a time, then make the call. Every part returns a finding, and “normal” counts.</p>
  </header>
  <section class="how panel">
    <span class="eyebrow">Do the full 8-point exam</span>
    <ol class="order">${TILES.map(t=>`<li>${t.name}</li>`).join("")}</ol>
    <p>You’re expected to do all 8 parts unless there’s a reason not to. Each case has one or two findings that crack it, and some have a step that would hurt the patient. The exceptions: skip what’s unsafe with a possible open globe, activate first and shorten the exam for stroke in the thrombolytic window, and irrigate first for a chemical exposure.</p>
    <a class="textlink" href="#/exam">How to do each step</a>${Object.keys(results).length?` <a class="textlink" href="#/summary">See your summary</a>`:""}
  </section>
  ${groups}
  <footer class="foot">
    <span><a class="textlink" href="#/terms">Abbreviations and terms</a></span><span>Anonymous usage is counted. No cookies or personal identifiers.</span>
    <span>References are listed in each guide.</span>
    <span>Clinical teaching cases. Follow local protocols and consultant guidance.</span>
  </footer>`;
  app.querySelectorAll(".case-card").forEach(b=>b.addEventListener("click",()=>nav("case/"+b.dataset.case)));
  removeBar();
  window.scrollTo(0,0);
}

function openCase(id){
  const c = CASES.find(x=>x.id===id);
  const saved = SAVED[id];
  S = saved || {c, opened:[], order:[], harmed:[], extraDone:false, strokeAt:null, delayed:[], checkin:null, checkinShown:false, committed:false, answers:[]};
  S.fresh=null; S.freshQ=null;
  renderCase();
  window.scrollTo(0, saved ? saved.y : 0);
}

function focusOn(el, say){
  if(!el) return;
  if(!el.hasAttribute("tabindex")) el.setAttribute("tabindex","-1");
  el.focus({preventScroll:true});
  if(say) document.getElementById("sr").textContent = say.textContent;
}

function tileHTML(t,i){
  const c=S.c, open=S.opened.includes(t.k), harmMsg = c.harm && c.harm[t.k];
  const locked = S.committed;
  let body = `<span class="t-top"><span class="t-n">${i+1}</span><span class="t-name">${t.name}</span></span><span class="t-sub">${t.sub}</span>`;
  let cls="tile";
  if(open){
    cls+=" open"; if(S.fresh===t.k) cls+=" fresh";
    if(harmMsg){ cls+=" harm"; body+=`<div class="finding"><b>${esc(harmMsg)}</b></div>`; }
    else{
      body+=`<div class="finding">${c.f[t.k]}</div>`;
      const im = c.fimg && c.fimg[t.k];
      if(im) body+=`<img src="${IMG[im.src]}" alt="${esc(im.alt)}">`;
      if(c.delay && c.delay.includes(t.k) && S.delayed.includes(t.k)) body+=`<div class="note warn">${esc(c.delayNote)}</div>`;
      const ex = c.extra && c.extra[t.k];
      if(ex){
        if(S.extraDone) body+=`<div class="note bad"><b>${esc(ex.harm)}</b></div>`;
        else if(!S.committed) body+=`<button class="mini" data-extra="${t.k}">${esc(ex.label)}</button>`;
      }
    }
  }
  if(open) return `<div class="${cls}" tabindex="-1">${body}</div>`;
  return `<button class="${cls}" data-tile="${t.k}" aria-label="${esc(t.name)}: tap to examine" ${locked?'aria-disabled="true"':''}>${body}</button>`;
}

function renderCase(){
  const c=S.c, tc=TRACKS[c.track].color;
  const idx = CASES.indexOf(c);
  let strokeHTML="";
  if(c.stroke){
    strokeHTML = `<div class="row-actions"><button class="stroke" id="strokeBtn" ${S.strokeAt!==null||S.committed?"disabled":""}>Activate stroke team?</button></div>`;
    if(S.strokeAt!==null) strokeHTML += `<div class="note ${c.stroke.role==="no"?"":"good"}">${esc(c.stroke.msg)}</div>`;
  }
  let checkin="";
  if(S.checkinShown && S.checkin===null && !S.committed){
    checkin = `<div class="checkin" id="checkin"><p>${esc(c.ciq||"Quick check: what’s your leading diagnosis right now?")}</p><div class="pills">${c.qs[0].o.map((o,i)=>`<button class="pill" data-ci="${i}">${esc(o)}</button>`).join("")}<button class="pill ghost" data-ci="-1">Skip</button></div></div>`;
  }
  app.innerHTML = `
  <div class="topbar"><button class="back" id="backBtn">← All cases</button><span class="where">Case ${c.id} of ${CASES.length}</span></div>
  <div style="--tc:${tc}">
    <header class="case-head"><span class="eyebrow">Case ${c.id} · ${TRACKS[c.track].name}${c.level==="Senior bonus"?" · Senior bonus":""}</span><h2>${c.cc}</h2></header>
    <div class="triage"><div class="eyebrow">Triage note</div><p>${esc(c.triage)}</p></div>
    ${strokeHTML}
    <div class="section-label"><h3>Examine</h3><span class="count">${S.opened.length} of 8 checked</span></div>
    <div class="tiles">${TILES.map(tileHTML).join("")}</div>
    ${checkin}
    <div id="qzone">${S.committed?questionsHTML():""}</div>
  </div>`;
  document.getElementById("backBtn").onclick=home;
  const sb=document.getElementById("strokeBtn"); if(sb) sb.onclick=()=>{ S.strokeAt=S.opened.length; renderCase(); const n=app.querySelector(".row-actions + .note"); focusOn(n,n); };
  app.querySelectorAll("[data-tile]").forEach(b=>b.addEventListener("click",()=>tap(b.dataset.tile)));
  app.querySelectorAll("[data-extra]").forEach(x=>x.addEventListener("click",()=>{
    S.extraDone=true; S.fresh=null; if(!S.harmed.includes("pocus")) S.harmed.push("pocus");
    const y=window.scrollY; renderCase(); window.scrollTo(0,y);
  }));
  app.querySelectorAll("[data-ci]").forEach(b=>b.addEventListener("click",()=>{ S.checkin=+b.dataset.ci; S.fresh=null; const y=window.scrollY; renderCase(); window.scrollTo(0,y); focusOn(document.getElementById("callBtn")); }));
  app.querySelectorAll("[data-q]").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.q,+b.dataset.o)));
  const nx=document.getElementById("nextBtn"); if(nx) nx.onclick=()=>{ if(idx===CASES.length-1) nav("summary"); else nav("case/"+CASES[idx+1].id); };
  const rb=document.getElementById("retryBtn"); if(rb) rb.onclick=()=>{ delete SAVED[c.id]; openCase(c.id); };
  const hb=document.getElementById("homeBtn"); if(hb) hb.onclick=home;
  renderBar();
}

function tap(k){
  if(S.committed) return;
  if(S.opened.includes(k)) return;
  S.opened.push(k); S.fresh=k;
  const c=S.c;
  if(c.harm && c.harm[k]) S.harmed.push(k);
  if(c.delay && c.delay.includes(k) && S.strokeAt===null) S.delayed.push(k);
  if(S.opened.length===3 && !S.checkinShown){ S.checkinShown=true; }
  const y=window.scrollY; renderCase(); window.scrollTo(0,y);
  const t=app.querySelector(".tile.fresh"); if(t) focusOn(t, t.querySelector(".finding"));
}

function removeBar(){ const b=document.getElementById("callbar"); if(b) b.remove(); }
function renderBar(){
  removeBar();
  if(!S || S.committed) return;
  const bar=document.createElement("div"); bar.className="callbar"; bar.id="callbar";
  bar.innerHTML=`<div class="inner"><span>Ready? Commit to a diagnosis and next step.</span><button class="primary" id="callBtn" ${S.opened.length?"":"disabled"}>Make the call</button></div>`;
  document.body.appendChild(bar);
  document.getElementById("callBtn").onclick=()=>{
    S.committed=true; S.fresh=null; S.freshQ=0; if(S.checkin===null) S.checkin=-1;
    renderCase();
    const q=document.getElementById("qzone"); if(q) q.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"start"});
    focusOn(app.querySelector(".q h3"));
  };
}

function questionsHTML(){
  const c=S.c; let html="";
  for(let i=0;i<c.qs.length;i++){
    if(i>S.answers.length) break;
    const q=c.qs[i], picked=S.answers[i];
    const done = picked!==undefined;
    html += `<div class="q${S.freshQ===i?" fresh":""}"><span class="eyebrow">${q.senior?"Senior follow-up":"Question "+(i+1)}</span><h3>${esc(q.q)}</h3><div class="opts">${q.o.map((o,j)=>{
      let cls="opt"; if(done){ if(j===q.a) cls+=" right"; else if(j===picked) cls+=" wrong"; else cls+=" dim"; }
      return `<button class="${cls}" data-q="${i}" data-o="${j}" ${done?"disabled":""}><span class="k">${LETTERS[j]}</span><span>${esc(o)}</span></button>`;}).join("")}</div>`;
    if(done){
      const right = picked===q.a;
      const fb = q.fb && q.fb[picked];
      html += `<div class="note ${right?"good":"bad"}"><b>${right?"Correct.":"Not quite."}</b> ${esc(fb||q.why||"")}${!right?` The answer is ${LETTERS[q.a]}.`:""}</div>`;
    }
    html += `</div>`;
  }
  if(S.answers.length===c.qs.length) html += debriefHTML();
  return html;
}

function answer(i,o){
  if(S.answers[i]!==undefined) return;
  S.answers[i]=o; S.fresh=null; S.freshQ=i+1;
  if(S.answers.length===S.c.qs.length){
    const right=S.c.qs.filter((q,j)=>S.answers[j]===q.a).length;
    const c=S.c, safe=TILES.map(t=>t.k).filter(k=>!(c.harm && c.harm[k]));
    results[c.id]={right,total:c.qs.length,
      missed:c.hinge.filter(k=>!S.opened.includes(k)),
      harmed:S.harmed.slice(),
      got:safe.filter(k=>S.opened.includes(k)).length, safe:safe.length,
      noStroke:!!(c.stroke && c.stroke.role==="correct" && S.strokeAt===null)};
    store.set("eyecb-results-v2",results);
  }
  const y=window.scrollY; renderCase(); window.scrollTo(0,y);
  const n=app.querySelectorAll(".q")[i].querySelector(".note"); focusOn(n,n);
}

function debriefHTML(){
  const c=S.c, items=[];
  const name=k=>TILES.find(t=>t.k===k).name;
  if(c.hinge.length){
    c.hinge.forEach(k=>{
      items.push(S.opened.includes(k)
        ? `<li><span class="mark ok">✓</span><span>You checked <b>${name(k)}</b>, one of the findings that cracks this case.</span></li>`
        : `<li><span class="mark no">✕</span><span>You didn’t check <b>${name(k)}</b>. That finding cracks this case.</span></li>`);
    });
  } else {
    items.push(`<li><span class="mark mid">i</span><span>${esc(c.noHingeNote)}</span></li>`);
  }
  S.harmed.forEach(k=>{
    const msg = k==="pocus" ? "You ordered ocular ultrasound on a possible open globe." : `You checked <b>${name(k)}</b> on a possible open globe.`;
    items.push(`<li><span class="mark no">!</span><span>${msg} In a real patient, that step could cause harm.</span></li>`);
  });
  if(c.stroke && c.stroke.role==="correct"){
    if(S.strokeAt===null) items.push(`<li><span class="mark no">✕</span><span>You never activated the stroke team.</span></li>`);
    else if(S.delayed.length) items.push(`<li><span class="mark mid">!</span><span>You activated, but only after ${S.delayed.map(name).join(", ")}. The rapid screen was enough; those could wait.</span></li>`);
    else if(S.opened.slice(0,S.strokeAt).includes("vf")) items.push(`<li><span class="mark ok">✓</span><span>You activated the stroke team after the rapid screen. That’s the move.</span></li>`);
    else if(S.opened.includes("vf")) items.push(`<li><span class="mark ok">✓</span><span>You activated early and checked fields alongside it. That’s the move.</span></li>`);
    else items.push(`<li><span class="mark mid">!</span><span>Good, you activated early. Still do the rapid screen in parallel, including fields.</span></li>`);
  }
  if(c.stroke && c.stroke.role==="ok" && S.strokeAt!==null) items.push(`<li><span class="mark ok">✓</span><span>You engaged the stroke/TIA pathway.</span></li>`);
  const safe = TILES.map(t=>t.k).filter(k=>!(c.harm && c.harm[k]));
  const got = safe.filter(k=>S.opened.includes(k)).length;
  if(got===safe.length) items.push(`<li><span class="mark ok">✓</span><span>Complete exam: all ${safe.length} safe parts checked.</span></li>`);
  else items.push(`<li><span class="mark mid">${got}</span><span>${got} of ${safe.length} safe exam parts checked.</span></li>`);
  if(S.checkin!==null && S.checkin>=0){
    const ok=S.checkin===c.qs[0].a;
    items.push(`<li><span class="mark ${ok?"ok":"mid"}">${ok?"✓":"?"}</span><span>Your early call after three parts: ${esc(c.qs[0].o[S.checkin])}.</span></li>`);
  }
  const img = c.img ? `<figure><img src="${IMG[c.img.src]}" alt="${esc(c.img.cap)}"><figcaption>${esc(c.img.cap)}</figcaption></figure>` : "";
  return `<section class="debrief${S.freshQ===c.qs.length?" fresh":""}" style="--tc:${TRACKS[c.track].color}">
    <span class="eyebrow">Debrief · Case ${c.id}</span>
    <h3>${esc(c.dbt||c.qs[0].o[c.qs[0].a])}</h3>
    <ul class="checks">${items.join("")}</ul>
    <div class="teach"><p><span class="lbl">Teaching point.</span> ${esc(c.teach)}</p>${c.pearl?`<p><span class="lbl">${esc(c.pearlLabel||"Senior pearl.")}</span> ${esc(c.pearl)}</p>`:""}</div>
    ${img}
    ${reviewHTML(c)}${guideReviewHTML(c)}
    ${refsLinkHTML(c)}
    <div class="next-row"><button class="primary" id="nextBtn" style="margin-left:0">${CASES.indexOf(c)===CASES.length-1?"See your summary →":"Next case →"}</button><button class="secondary" id="retryBtn">Try again</button><button class="secondary" id="homeBtn">All cases</button></div>
  </section>`;
}


/* ================= Case summary ================= */
function summaryPage(){
  const tname=k=>TILES.find(t=>t.k===k).name;
  const done=CASES.filter(c=>results[c.id]);
  const right=done.reduce((a,c)=>a+results[c.id].right,0), total=done.reduce((a,c)=>a+results[c.id].total,0);
  const got=done.reduce((a,c)=>a+results[c.id].got,0), safe=done.reduce((a,c)=>a+results[c.id].safe,0);
  const unsafe=done.reduce((a,c)=>a+results[c.id].harmed.length,0);
  const missed=[...new Set(done.flatMap(c=>results[c.id].missed))];
  const rows=CASES.map(c=>{
    const r=results[c.id], tc=TRACKS[c.track].color;
    if(!r) return `<a class="sum-row todo" href="#/case/${c.id}" style="--tc:${tc}"><span class="top"><span class="nm">Case ${c.id}: ${c.cc}</span><span class="sc">Not done</span></span></a>`;
    const fl=[];
    if(r.missed.length) fl.push("Key finding not checked: "+r.missed.map(tname).join(", "));
    if(r.harmed.length) fl.push("Unsafe step on a possible open globe");
    if(r.noStroke) fl.push("Stroke team not activated");
    return `<a class="sum-row" href="#/case/${c.id}" style="--tc:${tc}"><span class="top"><span class="nm">Case ${c.id}: ${c.cc}</span><span class="sc">${r.right}/${r.total}</span></span><span class="ds">${esc(c.dbt||c.qs[0].o[c.qs[0].a])} · ${r.got} of ${r.safe} safe exam parts</span>${fl.map(f=>`<span class="fl">${f}</span>`).join("")}</a>`;
  }).join("");
  app.innerHTML = `
  <div class="topbar"><a class="back" href="#/cases">← All cases</a><span class="where"><a href="#/exam">8-point exam</a></span></div>
  <header class="sum-head"><h1>Your summary</h1>
    <p class="lede">${done.length===CASES.length?"You’ve finished all "+CASES.length+" cases.":done.length+" of "+CASES.length+" cases finished."} Results stay on this device.</p></header>
  <div class="sum-stats">
    <div><b>${right}/${total}</b><span>Questions correct</span></div>
    <div><b>${got}/${safe}</b><span>Safe exam parts checked</span></div>
    <div><b>${unsafe}</b><span>Unsafe steps taken</span></div>
  </div>
  ${missed.length?`<section class="blk"><p class="blk-h">Exam steps to review</p><div class="review">${missed.map(k=>{const i=TILES.findIndex(t=>t.k===k); return `<a href="#/exam/${k}"><span class="rn">${i+1}</span>${TILES[i].name}</a>`;}).join("")}</div></section>`:""}
  <section class="sum-list">${rows}</section>
  <div class="next-row" style="margin-top:18px"><a class="secondary" href="#/cases" style="text-decoration:none;color:inherit">All cases</a><button class="secondary" id="clearBtn">Clear my results</button></div>
  <footer class="foot"><span><a class="textlink" href="#/terms">Abbreviations and terms</a></span><span>Anonymous usage is counted. No cookies or personal identifiers.</span></footer>`;
  document.getElementById("clearBtn").onclick=()=>{ results={}; store.set("eyecb-results-v2",results); Object.keys(SAVED).forEach(k=>delete SAVED[k]); summaryPage(); };
  removeBar();
  window.scrollTo(0,0);
}

/* ================= 8-point exam content ================= */
const EXAM = [
{ k:"va", title:"Visual acuity",
  why:"The best single measure of how sick the eye is. It sets the baseline, drives triage urgency, and is expected before most dispositions.",
  how:["Test <b>each eye separately</b>.","Have them wear their <b>corrective lenses</b> when available. If not, have them look through a <b>pinhole</b>.","Near card or wall chart, depending on the patient’s mobility.","Phone apps for testing visual acuity are another option.","If they can’t read the chart, document <b>functional vision</b>."],
  extra:`<div class="blk"><p class="blk-h">Functional vision ladder</p>
    <div class="ladder" role="list">${[["Reads chart",64],["Counts fingers",52],["Hand motion",40],["Light perception",28],["No light perception",8]].map(([l,h])=>`<div class="rung" role="listitem"><div class="bar" style="height:${h}px"></div><div class="lbl">${l}</div></div>`).join("")}</div></div>`,
  catches:["CRAO / BRAO","Retinal detachment","Vitreous hemorrhage","Optic neuritis / neuropathy","Keratitis / corneal ulcer","AACG","Endophthalmitis","Open globe / severe trauma"],
  pitfall:"“Can’t see the E” is not the end. Document the best functional estimate. Even “no light perception OD” is meaningful." },

{ k:"pupils", title:"Pupils / RAPD",
  why:"An RAPD means asymmetric afferent disease: the optic nerve or severe retinal dysfunction. An abnormal pupil shape can signal open globe, acute angle closure, iritis, or prior surgery.",
  how:["Check size, symmetry, direct and consensual response.","Compare pupil size in <b>bright and dim</b> light.","Look for an irregular, peaked, teardrop, fixed, or mid-dilated pupil."],
  extra:`<div class="callout tip"><span class="ch">Swinging flashlight test</span>
      <span>Dim the room. Swing a bright light briskly between the eyes, holding <b>about 3 seconds</b> on each. With an RAPD, the affected pupil <b>dilates</b> instead of constricting when the light reaches it.</span></div>
    <div class="blk"><p class="blk-h">Anisocoria: which pupil is abnormal?</p>
      <div class="compare">
        <div><span class="k">More unequal in bright light</span><span class="v">The <b>larger</b> pupil is abnormal.</span></div>
        <div><span class="k">More unequal in the dark</span><span class="v">The <b>smaller</b> pupil is abnormal.</span></div>
      </div>
      <span class="frame-sub">Either way, check for ptosis and EOM abnormalities.</span></div>
    <div class="callout tip"><span class="ch">Consensual photophobia</span><span>Pain in the affected eye when you shine light in the <b>unaffected</b> eye points to iritis / uveitis: inflammation in the anterior chamber, not just surface disease.</span></div>`,
  catches:["CRAO","Optic neuritis","Ischemic optic neuropathy","Severe retinal detachment","Traumatic optic neuropathy","Orbital compartment syndrome","Open globe","AACG"], },

{ k:"vf", title:"Visual fields",
  why:"Homonymous field loss can hide behind normal acuity. Fields help tell whether the problem is in the eye or in the brain.",
  how:["Patient covers one eye; you cover your opposite eye. You both fixate on each other’s nose.","<b>Flash a finger count</b> in each of the four quadrants and ask how many fingers they see.","Test <b>each eye separately</b>. Both eyes open can mask a defect in one eye.","Ask what “left-sided vision loss” means: the left eye, or the left side of the world?"],
  extra:`<div class="blk"><p class="blk-h">What the pattern tells you</p>
    <div class="map">
      <div class="r"><span>Defect in one eye only</span><span>Retina or optic nerve until proven otherwise</span></div>
      <div class="r"><span>Outer half of the field in both eyes (bitemporal)</span><span>At the chiasm: pituitary lesion, <b>apoplexy if sudden with headache</b></span></div>
      <div class="r"><span>Same side, both eyes (homonymous)</span><span>Behind the chiasm, <b>often stroke</b></span></div>
    </div></div>
    <figure class="tall"><img src="${IMG.vfp}" alt="Visual field diagrams: monocular vision loss, bitemporal hemianopia, homonymous hemianopia, and homonymous quadrantanopia"><figcaption>Monocular loss affects one eye only. Bitemporal loss takes the outer field of each eye. Homonymous defects hit the same side of the field in both eyes.</figcaption></figure>`,
  pitfall:"A patient can read the chart and still have a stroke-level field cut. Don’t skip fields because acuity is normal." },

{ k:"eom", title:"Extraocular movements",
  why:"Finds orbital disease, cranial nerve patterns, entrapment, and clues to optic neuritis.",
  how:["Ask about diplopia.","Test all <b>six cardinal directions</b> of gaze (the H pattern).","If gaze is disconjugate or limited, test each eye separately.","Ask whether moving the eye hurts.","Stop if the exam is unsafe because of suspected open globe or severe trauma."],
  extra:`<div class="blk"><p class="blk-h">What EOMs can find</p>
    <div class="map">
      <div class="r"><span>Pain with movement</span><span>Orbital cellulitis (earliest sign), optic neuritis, scleritis</span></div>
      <div class="r"><span>Restricted movement</span><span>Orbital fracture / entrapment, orbital compartment syndrome, cranial nerve palsy</span></div>
      <div class="r"><span>Diplopia with movement</span><span>Entrapment, cranial nerve palsy, cavernous sinus process</span></div>

{ k:"ext", title:"External inspection",
  why:"Many dangerous diagnoses are visible before any device is used. Compare both eyes side by side: subtle asymmetry is often the finding.",
  extra:`<div class="blk"><p class="blk-h">Look for</p>
    <div class="map">
      <div class="r"><span>Lids / lashes</span><span>Swelling, laceration, ptosis, foreign body, medial canthus injury</span></div>
      <div class="r"><span>Conjunctiva</span><span>Diffuse injection, ciliary flush, chemosis, subconjunctival hemorrhage</span></div>
      <div class="r"><span>Cornea</span><span>Haze, opacity, infiltrate, ulcer, foreign body</span></div>
      <div class="r"><span>Anterior chamber</span><span>Hyphema, hypopyon, shallow or deep anterior chamber asymmetry</span></div>
      <div class="r"><span>Pupil</span><span>Irregular, peaked, mid-dilated</span></div>
      <div class="r"><span>Globe / orbit</span><span>Proptosis, enophthalmos, globe displacement, obvious rupture</span></div>
    </div></div>`,
  catches:["Open globe","Hyphema","Endophthalmitis","Keratitis / corneal ulcer","AACG","Orbital cellulitis","Orbital compartment syndrome","Lid margin / canalicular laceration","Iritis"],
  pitfall:"After trauma, a severe subconjunctival hemorrhage (especially 360°) can hide a scleral laceration and open globe." },

{ k:"iop", title:"Intraocular pressure",
  why:"Confirms acute angle-closure glaucoma, helps risk-stratify hyphema, and supports orbital compartment syndrome when measuring is safe.",
  stop:`<div class="callout stop"><span class="ch">Do not measure IOP if open globe is possible</span>
    <ul><li>Penetrating injury, irregular or teardrop pupil, extrusion, positive Seidel</li><li>High-risk mechanism: high-velocity metal on metal, lawnmower, glass, blast</li></ul></div>`,
  how:["Instill a topical anesthetic such as tetracaine, then measure with the <b>Tono-Pen</b>.","Measure <b>both eyes routinely</b> for comparison.","If you must hold the lids open, brace your fingers on the <b>bony orbital rim</b>. Never press on the globe."],
  extra:`<div class="callout tip"><span class="ch">Reading the number</span><span>Normal is about 8–21 mmHg. A clear difference between the eyes matters. Above 40 is the range seen in acute angle closure and orbital compartment syndrome.</span></div>`,
  catches:["AACG","Hyphema complications","Orbital compartment syndrome","Secondary glaucoma after trauma or inflammation"],
  pitfall:"Lid squeezing, or pressure on the globe while holding the lids, gives a falsely high reading." },

{ k:"slit", title:"Slit lamp / fluorescein",
  why:"The anterior segment exam: the cornea and conjunctiva, anterior chamber, iris, and lens.",
  video:{url:"https://youtu.be/EOKh8zheBT4", title:"Slit Lamp Exam: ED Procedure Walkthrough", src:"miniEM · YouTube"},
  how:["Topical anesthetic if needed.","Apply a fluorescein strip moistened with saline.","Sweep with <b>white light first</b>: cornea, anterior chamber, pupil, lens.","Then switch to the <b>cobalt blue</b> filter and read the uptake pattern.","Use a Wood lamp if the patient can’t sit up for the slit lamp.","If you suspect an open globe, look for a <b>Seidel sign</b>. If it’s positive, put no pressure on the eye and shield it."],
  extra:`<div class="blk"><p class="blk-h">Fluorescein patterns</p>
    <div class="map">
      <div class="r hd"><span>You see</span><span>Think</span></div>
      <div class="r"><span>Linear vertical uptake</span><span>Subtarsal foreign body: <b>evert the lid</b></span></div>
      <div class="r"><span>Dendritic lesion</span><span>HSV</span></div>
      <div class="r"><span>Diffuse punctate uptake</span><span>UV keratitis, dry eye, mild abrasion</span></div>
      <div class="r"><span>Epithelial defect plus infiltrate or opacity</span><span>Keratitis / corneal ulcer</span></div>
      <div class="r"><span>Streaming or dilution</span><span>Positive Seidel: <b>open globe</b> concern</span></div>
    </div></div>
    <div class="blk"><p class="blk-h">Slit lamp findings</p>
    <div class="map">
      <div class="r"><span>Cells / flare</span><span>Uveitis / iritis</span></div>
      <div class="r"><span>Hypopyon</span><span>Endophthalmitis or severe keratitis</span></div>
      <div class="r"><span>Hyphema</span><span>Trauma, bleeding risk</span></div>
      <div class="r"><span>Corneal infiltrate</span><span>Keratitis / corneal ulcer</span></div>
      <div class="r"><span>Corneal haze or clouding</span><span>AACG, edema, chemical injury, keratitis</span></div>
      <div class="r"><span>Foreign body or rust ring</span><span>Retained foreign body</span></div>
    </div></div>
    <div class="callout stop"><span class="ch">Caution with home tetracaine</span><span>If any is dispensed, give <b>no more than a 24-hour supply</b> and warn against use beyond one day. Prolonged use causes corneal toxicity and delays epithelial healing.</span></div>`,

function practiceHTML(k, cs, label){
  cs = cs || CASES.filter(c=>c.hinge && c.hinge.includes(k));
  if(!cs.length) return "";
  return `<div class="blk"><p class="blk-h">${label||"Cases where this step is key"}</p>
    <div class="prac">${cs.map(c=>`<a class="pc" href="#/case/${c.id}" style="--tc:${TRACKS[c.track].color}"><span class="n">Case ${c.id} · ${TRACKS[c.track].name}</span><span class="c">${c.cc}</span></a>`).join("")}</div></div>`;
}

function stepHTML(s,i){
  const pits = s.pitfalls || (s.pitfall ? [s.pitfall] : []);
  const pitHTML = !pits.length ? "" : pits.length===1
    ? `<div class="callout pit"><span class="ch">Pitfall</span><span>${pits[0]}</span></div>`
    : `<div class="callout pit"><span class="ch">Pitfalls</span><ul>${pits.map(p=>`<li>${p}</li>`).join("")}</ul></div>`;
  return `<section class="step" id="s-${s.k}">
    <header class="step-head"><span class="step-num">${i+1}</span><h2>${s.title}</h2></header>
    <p class="why">${s.why}</p>
    ${s.stop||""}
    ${s.how?`<div class="blk"><p class="blk-h">How to do it</p><ul class="dolist">${s.how.map(h=>`<li>${h}</li>`).join("")}</ul></div>`:""}
    ${s.video?`<a class="vid" href="${s.video.url}" target="_blank" rel="noopener"><span class="play" aria-hidden="true"></span><span><span class="vt">Watch: ${s.video.title}</span><span class="vs">${s.video.src}</span></span></a>`:""}

    ${pitHTML}
    ${practiceHTML(s.k)}
  </section>`;
}

function examPage(target){

    + [["x-stroke","Stroke"],["x-trauma","Trauma"],["x-peds","Kids"],["x-doc","Charting"]].map(([i,l])=>xl(i,l)).join("");

  </div>
  <header class="ex-head">
    <h1>The 8-point ED eye exam</h1>

    <ol class="ex-order">${order}</ol>
  </header>

  <section class="stopblock" id="x-stop">
    <h2>Exceptions to the full exam</h2>

    </div>
  </section>

  ${EXAM.slice(0,5).map((s,i)=>stepHTML(s,i)).join("")}

  ${EXAM.slice(5).map((s,i)=>stepHTML(s,i+5)).join("")}

  <section class="part" id="x-stroke">
    <h2>Rapid exam: stroke-window vision loss</h2>
    <p>When acute vision loss may need stroke activation, do the fast parts while you activate.</p>

      <div class="now"><h3>Do now, while activating</h3><ul><li>Visual acuity or functional vision</li><li>Pupils / RAPD</li><li>Visual fields</li><li>EOMs</li><li>External inspection</li><li>Focused neuro screen</li></ul></div>
      <div class="wait"><h3>Delay until the workup is moving</h3><ul><li>Fluorescein</li><li>Slit lamp</li><li>IOP</li><li>Ocular ultrasound</li><li>Prolonged undilated fundoscopy</li></ul></div>

  </section>

    <div class="split">
      <div class="now"><h3>Do</h3><ul><li>Shield the eye</li><li>NPO</li><li>Antiemetics and analgesia</li><li>IV antibiotics per local protocol</li><li>Tetanus update</li><li>Call ophthalmology</li><li>CT orbit (thin cuts, no contrast), mainly when a foreign body is possible, such as metal from grinding. It can also show intraocular gas or indirect signs of open globe.</li></ul></div>
      <div class="avoid"><h3>Avoid</h3><ul><li>Pressure on the globe</li><li>IOP measurement</li><li>Ocular ultrasound</li><li>Forceful lid opening</li><li>Removing a protruding foreign body</li></ul></div>
    </div>
    <p class="note">More in the <a class="textlink" href="#/learn/trauma/og">trauma guide</a>.</p>
  </section>

  <section class="part" id="x-peds">

    <ul class="dolist">
      <li>Functional vision may be the only acuity you get: <b>fix-and-follow</b> in infants, picture charts in toddlers, Snellen by school age.</li>
      <li>Use distraction, a parent’s lap, and short focused attempts. Cooperation is rarely sustained.</li>
      <li>In suspected open globe, use analgesia, antiemetics, and anxiolysis as needed to prevent vomiting and straining, which can push out more of the eye’s contents. Sedation is a judgment call.</li>

  // in-page jumps without breaking the hash route

    e.preventDefault(); jumpTo(a.dataset.jump);
  }));
  const cb = document.getElementById("copyTpl");
  cb.onclick = async ()=>{

      });
    });
  },{rootMargin:"-120px 0px -60% 0px"});
  app.querySelectorAll(".step,.part,.stopblock").forEach(s=>railObs.observe(s));
  window.scrollTo(0,0);
  if(target){ const id = EXAM.some(s=>s.k===target) ? "s-"+target : "x-"+target; requestAnimationFrame(()=>jumpTo(id,true)); }

function jumpTo(id,instant){
  const el=document.getElementById(id); if(!el) return;

  el.scrollIntoView({behavior:smooth?"smooth":"auto",block:"start"});
}

  { id:"conj", name:"Conjunctivitis", steps:["va","pupils","slit"],
    bl:"Reassuring only when vision, pupil, and cornea are normal, pain resolves with topical anesthetic, and there’s no photophobia or contact lens risk.",

vision: {
  track:"vision", title:"Vision loss",
  frame:"First question: could this be a stroke within the activation window?",
  sort:{ title:"Stroke window: what counts and what to do", bl:"",
    html:()=>`<p class="qintro"><b>Default:</b> complete the 8-point eye exam on every patient with acute nontraumatic vision loss. <b>Exception:</b> stroke/TIA concern within the local activation window. Do the rapid screen and activate in parallel.</p>
      <div class="blk"><p class="blk-h">Stroke/TIA concern includes</p><ul class="plainlist">${["Binocular vision loss","Homonymous hemianopia or quadrantanopia","Any focal neurologic symptom","Sudden complete or severe painless monocular vision loss","Transient monocular vision loss (amaurosis fugax)"].map(x=>`<li>${x}</li>`).join("")}</ul></div>
      <div class="split"><div class="now"><h3>If yes, and within the window</h3><ul><li>Activate or urgently engage the stroke/TIA pathway</li><li>Do the rapid eye/neuro screen</li><li>Engage ophthalmology at the same time when retinal ischemia is possible</li></ul></div>
        <div class="wait"><h3>If no immediate activation</h3><ul><li>Complete the full 8-point eye exam</li><li>Sort into retinal / posterior segment disease, GCA, optic neuritis / optic neuropathy, or other neuro-ophthalmic causes</li></ul></div></div>
      <div class="blk"><p class="blk-h">Rapid minimum eye/neuro screen</p>
        <div class="stepchips">${["va","pupils","vf","eom","ext"].map(k=>stepChip(k)).join("")}</div>
        <p class="note">Plus a <b>focused neurologic exam</b>. Don’t delay activation for fluorescein, slit lamp, IOP, ocular ultrasound, or prolonged undilated fundoscopy.</p></div>
      <div class="blk"><p class="blk-h">Key history</p><div class="map">${[
        ["Laterality","One eye, both eyes, or one side of the visual world?"],["Onset","Exact last known normal vision"],["Course","Transient, persistent, recurrent, progressive"],
        ["Pain","Eye pain, pain with EOMs, headache, scalp tenderness, jaw claudication, neck pain"],["Visual quality","Blackout, curtain, flashes / floaters, haze, cobwebs, central scotoma, color desaturation, diplopia"],
        ["Vascular risk","HTN, diabetes, hyperlipidemia, tobacco, atrial fibrillation, carotid disease, prior stroke / TIA"],["Inflammatory risk","Age over 50, PMR symptoms, autoimmune disease"],
        ["Neuro risk","MS / demyelinating disease, migraine, malignancy, hypercoagulable state"]].map(([k,v])=>`<div class="r"><span>${k}</span><span>${v}</span></div>`).join("")}</div></div>` },
  clues:[
    ["Sudden, severe, painless loss in one eye","Central retinal artery occlusion (CRAO)","crao","Stroke pathway now; ophtho"],
    ["A shade or blackout in one eye that fully resolved","Amaurosis fugax","amaurosis","Stroke/TIA workup and neurology before dispo"],
    ["The same side of the field missing in both eyes","Homonymous hemianopia / quadrantanopia","homonymous","Stroke pathway"],
    ["Flashes, floaters, curtain or shadow","Retinal tear / detachment, PVD, or vitreous hemorrhage","rd","Full 8-point eye exam; ophtho consult"],
    ["Age over 50 + headache, jaw claudication, scalp tenderness","Giant cell arteritis","gca","Steroids now; ESR, CRP"],
    ["Pain with eye movement + color desaturation","Optic neuritis","on","Ophtho + neurology"],
    ["Bitemporal field loss + sudden severe headache","Pituitary apoplexy","mimics","Urgent imaging; neurosurgery"]
  ],
  dx:[
  { id:"crao", name:"Central or branch retinal artery occlusion (CRAO / BRAO)", steps:["va","pupils","vf","fundus"],
    bl:"CRAO is a retinal stroke. Activate the stroke pathway; conservative maneuvers don’t replace it.",
    extraHTML:`<div class="blk"><p class="blk-h">Artery or vein, when you can’t see the fundus</p>
      <div class="compare">
        <div><span class="k">Artery occlusion (CRAO / BRAO)</span><ul class="cmplist"><li>Sudden, over seconds</li><li>Often severe: counting fingers or worse in CRAO</li><li>RAPD common</li><li>May follow transient episodes (amaurosis)</li><li>Embolic risk: carotid disease, atrial fibrillation, smoking</li><li>BRAO: sudden loss of one sector of the field</li></ul></div>
        <div><span class="k">Central or branch retinal vein occlusion (CRVO / BRVO)</span><ul class="cmplist"><li>Often subacute, or noticed on waking</li><li>Usually blurry rather than black; severity varies</li><li>RAPD mainly in severe (ischemic) CRVO</li><li>Risk: hypertension, diabetes, glaucoma, hypercoagulable state</li><li>BRVO: blurring in one sector, often gradual, sometimes minimal symptoms</li></ul></div>
      </div>
      <p class="note">Ocular POCUS: a <b>retrobulbar spot sign</b> (a bright dot in the central retinal artery just behind the globe) supports an embolic CRAO. Its absence doesn’t rule CRAO out, and the evidence is limited.</p></div>
      <div class="callout pit"><span class="ch">If you can’t tell</span><span>Treat sudden, severe, painless loss in one eye as CRAO: activate and get ophthalmology. Activating for a vein occlusion costs little. Missing an artery occlusion can cost the stroke workup and the treatment window.</span></div>`,
    sec:[["What it is",["CRAO: an embolus or clot blocks the central retinal artery, the main blood supply to the inner retina.", "BRAO: the same thing in a smaller branch, so only part of the retina is affected."]],
         ["Presentation",["CRAO: sudden severe painless monocular vision loss","BRAO: sudden painless monocular sectoral field loss"]],
         ["Workup",["Decreased visual acuity or field defect","A relative afferent pupillary defect (RAPD) may be present with severe retinal ischemia","Fundus may show retinal whitening, cherry-red spot, embolus, narrowed vessels, or may be hard to see early","Rapid eye/neuro screen","Stroke/TIA evaluation per local pathway","Ophthalmology for dilated retinal exam","Screen older patients for symptoms of giant cell arteritis (GCA)"]],
         ["Treatment and dispo",["Activate or urgently engage the stroke/TIA pathway if within the window","IV thrombolytics for CRAO are not standard of care. Two small randomized trials compared them with aspirin within 4.5 hours and found no significant vision benefit: alteplase (THEIA, likely underpowered, no safety concerns) and tenecteplase (TenCRAOS, more adverse events, including one fatal intracranial hemorrhage). Some centers still offer it, so the decision belongs to the stroke team. Your job is to get them involved in time.","Conservative maneuvers (ocular massage, anterior chamber paracentesis) should not delay stroke evaluation","Secondary prevention matters: neurology / stroke workup, vascular and cardiac evaluation, risk factor treatment"]]] },
  { id:"amaurosis", name:"Amaurosis fugax (transient monocular vision loss)", steps:["va","pupils","vf"],
    bl:"Resolved symptoms are not a resolved problem. Treat it as a TIA of the eye: same urgency, same workup.",
    sec:[["Presentation",["Transient monocular curtain, shade, or blackout","Often lasts seconds to minutes and resolves completely","Vascular risk factors usually present"]],
         ["Workup",["Vision and exam may be entirely normal at presentation","Treat as a TIA equivalent: carotid imaging, cardiac workup, antiplatelet decision-making","Screen older patients for giant cell arteritis (GCA)"]],
         ["Treatment and dispo",["Engage the stroke/TIA pathway per local protocol","Don’t discharge without a stroke/TIA workup and neurology engagement, even when symptoms have fully resolved"]]] },
  { id:"homonymous", name:"Homonymous hemianopia / quadrantanopia (retrochiasmal stroke)", steps:["vf"], img:{src:"vfp",cap:"Homonymous defects hit the same side of the field in both eyes, as a half (hemianopia) or a quarter (quadrantanopia). Monocular and bitemporal patterns are shown for comparison."},
    bl:"Only a visual field check finds this. Same-side loss in both eyes means the problem is behind the chiasm, and normal acuity should not reassure you.",
    lead:`<div class="callout stop"><span class="ch">Check visual fields on every patient with vision loss</span><span>These patients often read the chart normally and describe a field cut as a problem with “one eye.” Confrontation fields, <b>each eye separately</b>, are the only part of the exam that finds it.</span></div>`,
    sec:[["What it is",["Homonymous means the same side of the visual field is missing in both eyes: half of it (hemianopia) or a quarter (quadrantanopia).", "Retrochiasmal means the lesion is behind the optic chiasm, where the optic nerves cross."]],
         ["Presentation",["Patients may say “left eye vision loss” when they mean the left side of the world","Visual acuity may be normal","Can be isolated or come with weakness, numbness, aphasia, ataxia, neglect, or headache"]],
         ["Where the lesion can be",["Anywhere behind the chiasm: optic tract, optic radiations, or occipital cortex","Occipital lobe is the most common site; sparing of central vision points there","Temporal lobe (Meyer’s loop): superior quadrantanopia (“pie in the sky”)","Parietal lobe: inferior quadrantanopia, often with other parietal signs such as neglect"]],
         ["Workup",["<b>Test confrontation fields in each eye separately</b>","Same-side field loss in both eyes localizes behind the chiasm","Activate the stroke pathway when in the window"]],
         ["Treatment and dispo",["Stroke pathway, neuroimaging, neurology / stroke involvement"]]] },
  { id:"rd", name:"Retinal detachment / retinal tear", steps:["vf","fundus"], img:{src:"rd",cap:"Ocular POCUS: a detached retina, seen as a bright membrane in the posterior segment."},
    bl:"Flashes, floaters, or a curtain. A macula-on detachment is time-sensitive because central vision is still at stake.",
    sec:[["What it is",["The retina lifts off the wall of the eye and loses its main blood supply. It usually starts with a tear that lets fluid get underneath.", "Macula-on means the center of the retina is still attached, so central vision is preserved."]],
         ["Presentation",["Flashes, floaters, curtain or shadow, peripheral field loss","May be painless","Risk factors: trauma, prior surgery, high myopia, prior detachment"]],
         ["Workup",["Visual acuity and fields","Fundus exam if possible","Ocular POCUS if open globe isn’t suspected"]],
         ["Treatment and dispo",["Call ophthalmology for a suspected tear or detachment","Macula-on detachment is time-sensitive because central vision may be preserved","Don’t discharge based only on a negative ED ultrasound if symptoms remain concerning"]]] },
  { id:"vh", name:"Vitreous hemorrhage / posterior vitreous detachment (PVD)", steps:["fundus"],
    bl:"New, dense floaters or a poor fundus view can hide a retinal tear. Don’t anchor on “just floaters.”",
    sec:[["What it is",["Vitreous hemorrhage: bleeding into the vitreous, the gel that fills the back of the eye.", "PVD: the vitreous pulls away from the retina, usually with age. It can tear the retina as it separates."]],
         ["Presentation",["Hazy vision, floaters, cobwebs, red or brown tint, poor fundus view","Posterior vitreous detachment (PVD) symptoms can overlap with retinal tear / detachment"]],
         ["Workup",["Visual acuity, fields, pupils / relative afferent pupillary defect (RAPD)","Fundus view often limited","Ocular POCUS may show mobile echoes or membrane-like findings (when open globe isn’t suspected)","About 1 in 7 patients with acute PVD symptoms has a retinal tear; vitreous hemorrhage makes a tear much more likely"]],
         ["Treatment and dispo",["Discuss with ophthalmology; vitreous hemorrhage and PVD symptoms can hide a retinal tear","Avoid anchoring on “just floaters” when symptoms are new, dense, or come with a curtain or field loss"]]] },
  { id:"crvo", name:"Central or branch retinal vein occlusion (CRVO / BRVO)", steps:["fundus","pupils"],
    bl:"Painless blurry vision with diffuse retinal hemorrhages. Severe loss or a relative afferent pupillary defect (RAPD) raises the urgency.",
    sec:[["What it is",["A clot blocks the central retinal vein or one of its branches. Blood backs up, causing retinal hemorrhage and swelling."]],
         ["Presentation",["Painless monocular blurry vision or field loss","Often subacute, but can feel sudden","Vascular risk factors common"]],
         ["Workup",["Fundus may show diffuse retinal hemorrhages, venous dilation / tortuosity, cotton-wool spots, macular edema","RAPD can occur with severe ischemic CRVO"]],
         ["Treatment and dispo",["Ophthalmology follow-up or consult depending on severity and local resources","Evaluate vascular risk factors","Severe vision loss, RAPD, or diagnostic uncertainty should increase urgency"]]],
    extraHTML:`<p class="note">Can’t see the fundus? See <a class="textlink" href="#/learn/vision/crao">artery vs vein in the retinal artery occlusion card</a>.</p>` },
  { id:"gca", name:"Giant cell arteritis (GCA)",
    bl:"Suspect GCA? Give steroids now. Don’t wait for biopsy or imaging confirmation.",
    sec:[["What it is",["Inflammation of large and medium arteries in people over 50, including the temporal arteries and the arteries that feed the optic nerve. Also called temporal arteritis.", "Vision loss can be permanent, and the other eye is at risk."]],
         ["Presentation",["Age over 50 with transient or persistent visual symptoms","Headache, scalp tenderness, jaw claudication, constitutional symptoms, and polymyalgia rheumatica (PMR) symptoms: aching and stiffness in the shoulders and hips"]],
         ["Workup",["ESR, CRP, CBC","Ask explicitly about jaw claudication and scalp tenderness","May cause amaurosis fugax, central retinal artery occlusion, or ischemic optic neuropathy"]],
         ["Treatment and dispo",["Empiric high-dose steroids immediately when suspected. With visual symptoms: IV methylprednisolone 500–1,000 mg daily. If IV isn’t available right away, or there’s no threat to vision: oral prednisone 1 mg/kg (up to about 60 mg). Follow local protocol.","Ophthalmology and rheumatology / medicine involvement","Usually admit or arrange urgent coordinated specialty care, depending on local system and severity"]]] },
  { id:"on", name:"Optic neuritis / optic neuropathy", steps:["pupils","eom"],
    bl:"Subacute loss in one eye with pain on eye movement and washed-out colors, in a quiet-looking eye.",
    sec:[["What it is",["Optic neuritis: inflammation of the optic nerve, often demyelinating and linked to multiple sclerosis.", "Optic neuropathy: the broader term for damage to the optic nerve from any cause."]],
         ["Optic neuritis: presentation",["Subacute monocular vision loss","Pain with eye movement","Color desaturation, central scotoma","Often a relatively quiet-appearing eye","<b><i>Not all of these need to be present, and often they aren’t.</i></b>"]],
         ["Optic neuritis: workup",["Visual acuity, pupils / relative afferent pupillary defect (RAPD), color testing / red desaturation, fields","Fundus may be normal in retrobulbar neuritis","Stat MRI brain and orbits with contrast; involve neurology and ophthalmology"]],
         ["Optic neuritis: treatment and dispo",["Ophthalmology and neurology involvement","Steroid decisions depend on typical vs atypical features and specialist guidance"]],
         ["Nonarteritic anterior ischemic optic neuropathy (NAION)",["A small-vessel stroke of the optic nerve head","Usually over 50 with vascular risk factors: sudden, painless loss in one eye, often noticed on waking","RAPD and a swollen disc, often with loss of the lower half of the field in that eye (an inferior altitudinal defect)","Rule out giant cell arteritis first: ask the questions and send ESR, CRP, and platelets. Arteritic disease is typically more severe and needs steroids now","No proven ED treatment. Discuss with ophthalmology the same day"]]] },
  { id:"mimics", name:"Other neuro-ophthalmic mimics",
    bl:"Pituitary apoplexy, toxic optic neuropathy, and angle closure can all present as vision loss.",
    sec:[["Pituitary apoplexy / chiasmal lesions",["Apoplexy is sudden bleeding or infarction in a pituitary tumor, which compresses the optic chiasm","Bitemporal hemianopia + sudden severe headache; may have cranial nerve palsies, altered mental status, endocrine collapse","True emergency: neurosurgery and endocrine involvement, urgent imaging"]],
         ["Toxic optic neuropathy (methanol, ethylene glycol, others)",["Consider in atypical bilateral painless vision loss, especially with metabolic acidosis or a relevant exposure","Methanol classically: bilateral central vision loss, anion-gap metabolic acidosis, recent ingestion"]],
         ["Acute angle-closure glaucoma",["Painful red eye with vision loss, halos, nausea / vomiting: see <a class=\"textlink\" href=\"#/learn/redeye/aacg\">the painful / red eye guide</a>"]]] }
  ],
  after:[{cls:"tip", h:"Ocular POCUS pearls", html:`<ul><li>Useful for retinal detachment, vitreous hemorrhage, lens dislocation, optic nerve sheath diameter, retrobulbar hematoma</li><li><b>Contraindicated if open globe is suspected</b></li><li>A negative ocular POCUS does not rule out retinal detachment; clinical concern still warrants ophthalmology</li><li>Use plenty of gel and minimal probe pressure; a Tegaderm over the closed eye is standard</li></ul>`}],
  dispo:[["now","Stroke/TIA pathway now",["CRAO / BRAO / amaurosis fugax in the window","Homonymous field loss","Focal neurologic symptoms"]],
         ["urgent","Ophthalmology now or urgent discussion",["Retinal detachment / tear concern","Severe retinal ischemia concern","Vitreous hemorrhage","Severe unexplained monocular vision loss","GCA with visual symptoms","Optic neuritis / optic neuropathy"]],
         ["admit","Neurology / stroke involvement",["CRAO / BRAO","Homonymous field loss","Optic neuritis / optic neuropathy","Other neuro-ophthalmic localization concerns"]]],
  pitfalls:["Calling amaurosis fugax “resolved, so okay”","Missing homonymous field loss because acuity is normal","Forgetting GCA in an older patient with transient visual symptoms"],

trauma: {
  track:"trauma", title:"Trauma",
  frame:"First question: chemical? Open globe? Look before you press.",
  sort:{ title:"Checklist and trauma exam sequence", bl:"",
    html:()=>`<p class="qintro"><b>Look before you press.</b> Identify chemical injury, open globe, orbital compartment syndrome, hyphema, posterior injury, and periocular injuries that need specialty repair.</p>
      <ul class="plainlist">${["Chemical exposure?","Open globe or intraocular foreign body possible?","Orbital compartment syndrome?","Hyphema or significant anterior chamber injury?","Posterior segment or optic nerve concern?","Periocular laceration or orbital fracture?","Lower-risk abrasion / foreign body, after red flags are excluded?"].map(x=>`<li>${x}</li>`).join("")}</ul>
      <div class="blk"><p class="blk-h">Trauma-specific exam sequence</p><ol class="seq tseq">${["Stabilize life threats first","Look before pressing on the globe","Mechanism: blunt, penetrating, high-velocity metal / wood / glass, explosion, projectile, chemical splash","Visual acuity or functional vision","Pupils / RAPD","EOMs when safe","Red reflex when feasible","IOP only when open globe is not suspected (tetracaine first)","Slit lamp with fluorescein, and Seidel when open globe is suspected (Wood lamp if the patient can’t sit up)","Ocular POCUS only when open globe is not suspected"].map(x=>`<li>${x}</li>`).join("")}</ol></div>` },
  clues:[
    ["Chemical splash, powder, or industrial cleaner","Chemical injury","chem","Irrigate now; everything else waits"],
    ["Peaked pupil, positive Seidel, or high-velocity metal","Open globe / intraocular foreign body","og","Shield, NPO, IV antibiotics, ophtho"],
    ["Proptosis + tight lids + vision loss or RAPD","Orbital compartment syndrome","ocs","Canthotomy now; don’t wait for CT"],
    ["Layered blood in the anterior chamber","Hyphema","hyphema","Shield, head of bed up, ask about sickle cell"],
    ["Diplopia + restricted EOMs + cheek numbness","Orbital fracture / entrapment","fracture","CT; specialty consult"],
    ["Lid margin, medial to the punctum, or fat in the wound","Complex lid laceration","lid","Ophtho / oculoplastics"],
    ["Aching pain + photophobia 1–3 days after blunt trauma","Traumatic iritis","iritis","Exclude worse injury; ophtho follow-up"]
  ],
  dx:[
  { id:"chem", name:"Chemical ocular injury", steps:["ext"],
    bl:"Irrigate first. Everything else waits: don’t delay for visual acuity, pH paper, slit lamp, or a consult.",
    compare:[["Alkali","Lye, ammonia, drain cleaner, cement, oven cleaner. Saponifies cell membranes and penetrates deeper: far more dangerous, longer irrigation."],["Acid","Coagulates protein and tends to self-limit. Exception: hydrofluoric acid behaves more like alkali."]],
    sec:[["Presentation",["Chemical splash, powder, industrial cleaner, alkali or acid exposure","Severe pain, blepharospasm, tearing, decreased vision"]],
         ["Workup",["Check pH as soon as practical","Evert the lids and sweep the fornices for retained particulate when feasible","Look for epithelial defect, limbal ischemia (whitening at the limbus means severe), corneal haze, persistent abnormal pH"]],
         ["Treatment and dispo",["Irrigate immediately; topical anesthetic first if blepharospasm prevents adequate irrigation","Morgan lens with normal saline or lactated Ringer’s for continuous irrigation","Remove contact lenses and any particulate matter","Target pH 7.0–7.4, rechecked 5 minutes after stopping irrigation (early checks can be falsely normal)","Volume: 1–2 L minimum for most exposures; alkali burns may need 4–6 L or more","Ophthalmology for significant burns, persistent abnormal pH, limbal ischemia, epithelial defect, corneal haze, decreased vision, or an incomplete exam"]]] },
  { id:"og", name:"Open globe / intraocular foreign body (IOFB)", steps:["ext","slit"], img:{src:"og",cap:"Open globe: the pupil peaks toward the wound where iris has come through."},
    bl:"Shield, NPO, IV antibiotics, antiemetics, tetanus, and ophthalmology. CT mainly when a foreign body is possible.",
    sec:[["What it is",["A full-thickness wound through the cornea or sclera.", "An intraocular foreign body (IOFB) is an object that has entered the eye through that kind of wound."]],
         ["High-suspicion mechanisms",["Grinding or hammering metal on metal (classic for an occult intraocular metallic foreign body)","Lawnmower or string trimmer debris","Glass shattering","Wood splinters, fishhook, BB / pellet / airsoft","High-velocity projectile, explosion, blast","Severe blunt force, especially with periorbital fracture","The patient may report only “something hit my eye” and feel fairly well. Symptoms can be deceptively mild."]],
