<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Jonathan Dangers, MD, MPH">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Eye Exam Casebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,650&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --ground:#F5EFE3; --surface:#FFFBF3; --surface-2:#EFE6D4; --ink:#2B2520; --muted:#6E6254; --line:#DCCFB8;
  --accent:#3E5566; --accent-ink:#FFFFFF;
  --vision:#C2533C; --redeye:#A83A5A; --trauma:#9E6A12;
  --good:#2E7555; --good-bg:#E4F0E8; --bad:#A12D2D; --bad-bg:#F7E3DF; --warn:#8A5A00; --warn-bg:#F6EBD2;
  --shadow:0 1px 0 rgba(60,40,20,.06),0 6px 18px -10px rgba(60,40,20,.25);
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#1B1916; --surface:#25221E; --surface-2:#2F2B26; --ink:#EEE6D8; --muted:#B3A795; --line:#403A32;
    --accent:#8FB0C6; --accent-ink:#14191D;
    --vision:#E9876F; --redeye:#E07B9A; --trauma:#E2A845;
    --good:#7CC7A0; --good-bg:#1F3329; --bad:#F08A7E; --bad-bg:#3A2320; --warn:#E6B65C; --warn-bg:#352B18;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#1B1916; --surface:#25221E; --surface-2:#2F2B26; --ink:#EEE6D8; --muted:#B3A795; --line:#403A32;
  --accent:#8FB0C6; --accent-ink:#14191D;
  --vision:#E9876F; --redeye:#E07B9A; --trauma:#E2A845;
  --good:#7CC7A0; --good-bg:#1F3329; --bad:#F08A7E; --bad-bg:#3A2320; --warn:#E6B65C; --warn-bg:#352B18;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 96px}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--serif);font-weight:650;text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--muted)}

/* Home */
.masthead{padding-block:28px 8px;display:grid;gap:10px}
.chart{font-family:var(--mono);font-weight:600;color:var(--muted);letter-spacing:.35em;line-height:1.05;user-select:none}
.chart span{display:block}
.chart .l1{font-size:40px;color:var(--ink)} .chart .l2{font-size:24px} .chart .l3{font-size:15px}
.masthead h1{font-size:clamp(34px,7vw,50px)}
.lede{max-width:60ch;color:var(--ink);margin:0}
.byline{margin:-4px 0 4px;font-family:var(--serif);font-style:italic;font-size:18px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow)}
.how{display:grid;gap:12px;margin-block:18px}
.order{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none;counter-reset:o}
.order li{counter-increment:o;font-size:13px;background:var(--surface-2);border-radius:999px;padding:3px 10px 3px 6px;display:flex;gap:6px;align-items:center}
.order li::before{content:counter(o);font-family:var(--mono);font-size:11px;background:var(--ink);color:var(--ground);border-radius:999px;width:18px;height:18px;display:grid;place-items:center}
.how p{margin:0;max-width:65ch}
.mode{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;background:var(--surface)}
.mode input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.mode label{cursor:pointer}
.mode strong{display:block}
.mode small{color:var(--muted)}
.track{margin-block:26px 0;display:grid;gap:10px}
.track-head{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--tc);padding-bottom:6px}
.track-head h2{font-size:22px;color:var(--ink)}
.track-head .eyebrow{color:var(--tc)}
.cases{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.case-card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px;display:grid;gap:6px;align-content:start;position:relative;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.case-card:hover{transform:translateY(-2px);border-color:var(--tc)}
.case-card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.case-card .num{font-family:var(--mono);font-size:12px;color:var(--tc);font-weight:600}
.case-card .cc{font-family:var(--serif);font-size:19px;line-height:1.2;font-weight:500}
.case-card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.chip{font-size:11.5px;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chip.senior{background:var(--ink);color:var(--ground)}
.chip.done{background:var(--good-bg);color:var(--good)}
.foot{margin-top:34px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:4px}

/* Case */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);display:flex;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--line)}
.back{all:unset;cursor:pointer;font-weight:600;font-size:14px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.back:focus-visible{outline:3px solid var(--accent)}
.topbar .where{font-size:13px;color:var(--muted);margin-left:auto;text-align:right}
.case-head{padding-block:18px 10px;display:grid;gap:8px}
.case-head .eyebrow{color:var(--tc)}
.case-head h2{font-size:clamp(26px,5.5vw,34px)}
.triage{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--tc);border-radius:8px;padding:14px 16px;box-shadow:var(--shadow)}
.triage .eyebrow{margin-bottom:4px}
.triage p{margin:0;max-width:65ch}
.row-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-block:16px 6px}
.stroke{all:unset;box-sizing:border-box;cursor:pointer;font-weight:700;font-size:14px;padding:8px 14px;border-radius:8px;background:var(--surface);color:var(--bad);border:2px solid var(--bad);display:inline-flex;gap:8px;align-items:center}
.stroke:hover:not([disabled]){background:var(--bad-bg)}
.stroke[disabled]{opacity:.55;cursor:default}
.stroke:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.note{font-size:14px;padding:10px 12px;border-radius:8px;background:var(--surface-2);max-width:65ch}
.note.bad{background:var(--bad-bg);color:var(--ink);border-left:4px solid var(--bad)}
.note.warn{background:var(--warn-bg);border-left:4px solid var(--warn)}
.note.good{background:var(--good-bg);border-left:4px solid var(--good)}
.section-label{display:flex;justify-content:space-between;align-items:baseline;margin-block:18px 8px;gap:12px}
.section-label h3{font-size:19px}
.count{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px;align-content:start;min-height:84px;box-shadow:var(--shadow);transition:border-color .15s ease,background .15s ease}
.tile:hover:not([aria-disabled="true"]){border-color:var(--accent)}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tile .t-top{display:flex;gap:8px;align-items:baseline}
.tile .t-n{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted)}
.tile .t-name{font-weight:700;font-size:15px}
.tile .t-sub{font-size:12.5px;color:var(--muted)}
.tile.open{cursor:default;background:var(--surface);border-color:var(--ink)}
.tile.open .t-sub{display:none}
.tile .finding{font-size:14.5px;line-height:1.45}
.tile .finding b{font-weight:700}
.tile.harm{border-color:var(--bad);background:var(--bad-bg)}
.tile[aria-disabled="true"]:not(.open){opacity:.45;cursor:not-allowed}
.tile img{border-radius:6px;display:block;width:100%;height:auto;margin-top:4px}
.tile .mini{all:unset;cursor:pointer;font-size:13px;font-weight:700;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);justify-self:start}
.tile .mini:focus-visible{outline:3px solid var(--accent)}
.checkin{margin-block:12px;background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:14px;display:grid;gap:10px}
.checkin p{margin:0;font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{all:unset;cursor:pointer;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2)}
.pill:focus-visible{outline:3px solid var(--accent)}
.pill.ghost{background:transparent;color:var(--muted)}
.callbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 20px -14px rgba(0,0,0,.35)}
.callbar .inner{max-width:760px;margin:0 auto;display:flex;gap:12px;align-items:center}
.callbar .inner span{font-size:13px;color:var(--muted)}
.primary{all:unset;box-sizing:border-box;cursor:pointer;margin-left:auto;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:11px 18px;border-radius:9px;text-align:center}
.primary[disabled]{opacity:.45;cursor:default}
.primary:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.q{margin-block:18px;display:grid;gap:10px}
.q h3{font-size:19px}
.opts{display:grid;gap:8px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 14px;display:flex;gap:10px;align-items:flex-start;font-size:15px}
.opt .k{font-family:var(--mono);font-weight:600;color:var(--muted);min-width:1.2em}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.dim{opacity:.6}
.debrief{margin-block:24px;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--tc);border-radius:10px;padding:18px;display:grid;gap:14px;box-shadow:var(--shadow)}
.debrief h3{font-size:24px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checks li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.mark{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;margin-top:1px}
.mark.ok{background:var(--good)} .mark.no{background:var(--bad)} .mark.mid{background:var(--warn)}
:root[data-theme="dark"] .mark{color:#1B1916}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mark{color:#1B1916}}
.teach p{margin:0 0 8px;max-width:65ch}
.teach .lbl{font-weight:700}
.debrief figure{margin:0;display:grid;gap:6px}
.debrief figure img{border-radius:8px;border:1px solid var(--line);max-width:100%;height:auto}
.debrief figcaption{font-size:13px;color:var(--muted)}
.src{font-size:13px;color:var(--muted)}
.next-row{display:flex;gap:10px;flex-wrap:wrap}
.secondary{all:unset;cursor:pointer;font-weight:600;padding:10px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2)}
.secondary:focus-visible{outline:3px solid var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@keyframes reveal{from{opacity:.35;transform:translateY(3px)}to{opacity:1;transform:none}}
.tile.fresh .finding,.q.fresh,.debrief.fresh{animation:reveal .25s ease-out}

/* ---------- Shared additions ---------- */
:root{--stop:#962626;--stop-ink:#FFFFFF;--stop-soft:rgba(255,255,255,.12)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--stop:#5E1F1B;--stop-ink:#FBE9E6;--stop-soft:rgba(255,255,255,.07)}}
:root[data-theme="dark"]{--stop:#5E1F1B;--stop-ink:#FBE9E6;--stop-soft:rgba(255,255,255,.07)}
.textlink{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}
.topbar a.back{text-decoration:none;color:var(--ink)}
.topbar .where a{color:var(--accent);font-weight:700;text-decoration:none}

/* ---------- Hub ---------- */
.hub-routes{display:grid;gap:14px;margin-block:22px 4px}
@media (min-width:640px){.hub-routes{grid-template-columns:1fr 1fr}}
.route{box-sizing:border-box;text-decoration:none;color:var(--ink);display:grid;gap:14px;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);transition:border-color .15s ease}
.route:hover{border-color:var(--ink)}
.route:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.route h2{font-size:30px}
.route p{margin:0;color:var(--muted);max-width:40ch}
.route .go{justify-self:start;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:10px 16px;border-radius:9px;margin-top:2px}
.tm-list{display:grid;gap:6px}
.tm{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600;padding:6px 10px;border-left:5px solid var(--tc);background:var(--surface-2);border-radius:0 6px 6px 0}
.tm span:last-child{font-family:var(--mono);font-weight:600;color:var(--tc)}
.dots{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;max-width:320px}
.dots span{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:600;background:var(--ink);color:var(--ground)}
.dots span.dev{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.dots-key{font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.dots-key i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ink);margin-right:6px;vertical-align:-1px}
.dots-key i.dev{background:transparent;box-shadow:inset 0 0 0 2px var(--ink)}

/* ---------- Cases page header ---------- */
.cases-head{padding-block:18px 0;display:grid;gap:8px}
.cases-head h1{font-size:clamp(30px,6vw,40px)}

/* ---------- Exam page ---------- */
.exbar{position:sticky;top:0;z-index:5;background:var(--ground);margin-inline:-16px;padding:env(safe-area-inset-top,0px) 16px 0;border-bottom:1px solid var(--line)}
.exbar .topbar{position:static;border-bottom:0;padding-bottom:6px}
.rail{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.rail a{flex:none;text-decoration:none;color:var(--ink);font-size:13px;font-weight:600;padding:4px 11px 4px 4px;border-radius:999px;background:var(--surface-2);display:flex;gap:6px;align-items:center;white-space:nowrap}
.rail a.plain{padding-left:11px}
.rail a .rn{font-family:var(--mono);font-size:11px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--ground)}
.rail a.dev .rn{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.rail a.on{background:var(--accent);color:var(--accent-ink)}
.rail a.on .rn{background:var(--accent-ink);color:var(--accent);box-shadow:none}
.rail .sep{flex:none;width:1px;background:var(--line);margin-inline:3px}
.ex-head{padding-block:24px 4px;display:grid;gap:14px}
.ex-head h1{font-size:clamp(34px,7.5vw,50px)}
.frame{font-family:var(--serif);font-size:clamp(24px,5vw,30px);line-height:1.2;font-weight:500;margin:0;max-width:24ch;padding-left:16px;border-left:5px solid var(--accent)}
.frame-sub{margin:0;color:var(--muted);max-width:58ch}
.ex-order{display:grid;gap:0;margin:4px 0 0;padding:0;list-style:none;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
@media (min-width:560px){.ex-order{grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(4,auto)}}
.ex-order a{display:flex;gap:12px;align-items:center;padding:10px 14px;text-decoration:none;color:var(--ink);border-top:1px solid var(--line);font-weight:600}
.ex-order li:first-child a{border-top:0}
@media (min-width:560px){.ex-order li:nth-child(5) a{border-top:0}.ex-order li:nth-child(n+5){border-left:1px solid var(--line)}}
.ex-order a:hover{background:var(--surface-2)}
.ex-order .rn{font-family:var(--mono);font-size:13px;width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--ground)}
.ex-order li.dev .rn{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.ex-order small{display:block;font-weight:400;color:var(--muted);font-size:13px}

.stopblock{margin-block:26px 0;scroll-margin-top:120px;border-radius:14px;background:var(--stop);color:var(--stop-ink);padding:20px 18px;display:grid;gap:14px}
.stopblock h2{font-size:clamp(24px,5vw,30px);color:var(--stop-ink)}
.stopblock > p{margin:0;opacity:.92}
.stopgrid{display:grid;gap:10px}
@media (min-width:640px){.stopgrid{grid-template-columns:repeat(3,1fr)}}
.stopitem{background:var(--stop-soft);border-radius:10px;padding:12px 14px;display:grid;gap:4px}
.stopitem b{font-size:16px}
.stopitem span{font-size:14.5px;opacity:.95}

.step{margin-top:44px;scroll-margin-top:118px;display:grid;gap:16px}
.step-head{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:10px}
.step-num{font-family:var(--serif);font-size:68px;line-height:.78;font-weight:650;color:var(--accent);font-variant-numeric:lining-nums}
.step-head h2{font-size:clamp(25px,5.5vw,32px)}
.step-tag{font-size:14.5px;color:var(--muted);margin-top:3px}
.why{font-family:var(--serif);font-size:19px;line-height:1.5;margin:0;max-width:58ch}
.blk{display:grid;gap:8px}
.blk-h{font-weight:700;font-size:15px;color:var(--accent);margin:0}
.dolist{list-style:none;padding:0;margin:0;display:grid;gap:7px;max-width:62ch}
.dolist li{position:relative;padding-left:28px}
.dolist li::before{content:"";position:absolute;left:4px;top:.62em;width:12px;height:4px;border-radius:2px;background:var(--accent)}
@media (min-width:760px){.rail{flex-wrap:wrap;overflow:visible}}
.dolist li b{font-weight:700}
.catches{display:flex;flex-wrap:wrap;gap:6px}
.catches span{font-size:13.5px;padding:3px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface)}
.callout{border-radius:10px;padding:12px 14px;display:grid;gap:5px;font-size:15px;max-width:64ch}
.callout .ch{font-weight:700;font-size:14.5px}
.callout ul{margin:2px 0 0;padding-left:18px;display:grid;gap:4px}
.callout.pit{background:var(--warn-bg);border-left:5px solid var(--warn)}
.callout.pit .ch{color:var(--warn)}
.callout.stop{background:var(--bad-bg);border-left:5px solid var(--bad)}
.callout.stop .ch{color:var(--bad)}
.callout.tip{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent)}
.callout.tip .ch{color:var(--accent)}
.map{display:grid;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.map .r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
.map .r + .r{border-top:1px solid var(--line)}
.map .r > *{padding:9px 12px;font-size:14.5px}
.map .r > :first-child{font-weight:600;background:var(--surface-2)}
.map .r.hd > *{font-size:12.5px;font-weight:700;color:var(--muted);background:var(--surface);padding-block:7px}
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;align-items:end}
.ladder .rung{display:grid;gap:6px;align-content:end}
.ladder .bar{border-radius:6px 6px 2px 2px;background:var(--accent)}
.ladder .lbl{font-size:12.5px;font-weight:600;line-height:1.25}
.compare{display:grid;gap:8px}
@media (min-width:520px){.compare{grid-template-columns:1fr 1fr}}
.compare > div{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);display:grid;gap:4px}
.compare .k{font-weight:700}
.compare .v{font-size:14.5px}
.compare .v b{color:var(--accent)}
.step figure{margin:0;display:grid;gap:6px;max-width:520px}
.step figure img{border-radius:8px;border:1px solid var(--line);width:100%;height:auto}
.step figure.tall{max-width:400px}
.step figcaption{font-size:13px;color:var(--muted)}
.vid{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;max-width:520px;box-shadow:var(--shadow)}
.vid:hover{border-color:var(--ink)}
.vid:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.vid .play{flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent);position:relative}
.vid .play::after{content:"";position:absolute;left:17px;top:13px;border-style:solid;border-width:9px 0 9px 14px;border-color:transparent transparent transparent var(--accent-ink)}
.vid > span:last-child{display:grid;gap:2px}
.vid .vt{font-weight:700;line-height:1.3}
.vid .vs{font-size:13px;color:var(--muted)}
.prac{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.pc{text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--tc);border-radius:8px;padding:8px 12px;display:grid;gap:2px}
.pc:hover{border-color:var(--tc)}
.pc:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pc .n{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--tc)}
.pc .c{font-family:var(--serif);font-size:17px;line-height:1.2}
.gate{margin-top:48px;border:2px dashed var(--ink);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;max-width:64ch}
.gate .dots{grid-template-columns:repeat(3,26px);gap:4px}
.gate .dots span{font-size:11px}
.gate p{margin:0}
.part{margin-top:56px;scroll-margin-top:118px;display:grid;gap:14px}
.part > h2{font-size:clamp(24px,5vw,30px);border-bottom:2px solid var(--ink);padding-bottom:8px}
.part > p{margin:0;max-width:62ch}
.split{display:grid;gap:10px}
@media (min-width:560px){.split{grid-template-columns:1fr 1fr}}
.split > div{border-radius:10px;padding:14px;display:grid;gap:8px;align-content:start;border:1px solid var(--line);background:var(--surface)}
.split h3{font-size:18px}
.split ul{margin:0;padding-left:18px;display:grid;gap:4px}
.split .now{border-top:5px solid var(--good)} .split .now h3{color:var(--good)}
.split .wait{border-top:5px solid var(--warn)} .split .wait h3{color:var(--warn)}
.split .avoid{border-top:5px solid var(--bad)} .split .avoid h3{color:var(--bad)}
.tplwrap{display:grid;gap:8px}
.tpl{font-family:var(--mono);font-size:13px;line-height:1.6;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;white-space:pre-wrap;margin:0;overflow-x:auto}
.copy{all:unset;cursor:pointer;justify-self:start;font-weight:700;font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2)}
.copy:focus-visible{outline:3px solid var(--accent)}
details.refs{margin-top:44px;border-top:1px solid var(--line);padding-top:14px}
details.refs summary{cursor:pointer;font-weight:700}
details.refs ol{padding-left:20px;font-size:14px;color:var(--muted);display:grid;gap:6px}
details.refs a{color:var(--accent)}
.review{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.review a{text-decoration:none;color:var(--ink);font-weight:600;padding:5px 11px 5px 5px;border-radius:999px;background:var(--surface-2);display:inline-flex;gap:6px;align-items:center}
.review a .rn{font-family:var(--mono);font-size:11px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--ground)}
@media print{.exbar,.copy{display:none}.step,.part{break-inside:avoid-page}}
</style>
</head>

  teach:"Same-side field loss in both eyes means the problem is in the brain, not the eye. That’s what decides the action: stroke activation, not an ophthalmology consult. Patients often describe a right-field cut as “my right eye.” Normal acuity does not rule out a stroke, and you only find this with fields.",

    {q:"Best next step?", o:["Discharge with ophthalmology follow-up, since the exam is normal","Engage the stroke/TIA pathway per local protocol, with carotid and cardiac workup","Aspirin and discharge without imaging","MRI of the orbits","Reassure; symptoms resolved"], a:1,

    {q:"GCA as the cause: He now remembers his jaw aches when he chews steak, and his scalp is tender when he brushes his hair. What changes?", o:["Nothing; finish the TIA workup first","Start high-dose steroids now, send ESR and CRP, and involve ophthalmology; don’t wait for biopsy","Outpatient temporal artery biopsy before any treatment","NSAIDs for the jaw pain"], a:1, senior:true,

  teach:"Resolved symptoms don’t mean a resolved problem. The exam is usually normal, so the history carries the diagnosis. GCA belongs on the differential for the cause of amaurosis, alongside carotid and cardiac emboli. In anyone over 50, ask the GCA questions every time.",

/* ---------- state ---------- */
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
let hard = store.get("eyecb-hard", false);
let results = store.get("eyecb-results", {});
let S = null; // current case session
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LETTERS = "ABCDE";

function casesHome(){
  S = null;
  const groups = ["vision","redeye","trauma"].map(t=>{
    const cs = CASES.filter(c=>c.track===t);
    return `<section class="track" style="--tc:${TRACKS[t].color}">
      <div class="track-head"><h2>${TRACKS[t].name}</h2><span class="eyebrow">${cs.length} cases</span></div>
      <div class="cases">${cs.map(c=>{
        const r = results[c.id];
        return `<button class="case-card" data-case="${c.id}" style="--tc:${TRACKS[t].color}">
          <span class="num">CASE ${c.id}</span>
          <span class="cc">${c.cc}</span>
          <span class="meta">${c.level==="Senior bonus"?'<span class="chip senior">Senior bonus</span>':'<span class="chip">Core</span>'}${r?`<span class="chip done">Done · ${r.right}/${r.total}</span>`:""}</span>
        </button>`;}).join("")}</div>
    </section>`;
  }).join("");
  app.innerHTML = `
  <div class="topbar"><a class="back" href="#/">← Home</a><span class="where"><a href="#/exam">8-point exam</a></span></div>
  <header class="cases-head">
    <h1>Cases</h1>
    <p class="lede">Nine ED patients. Examine each eye one part at a time, in any order, then make the call. Every part returns a finding, and “normal” counts.</p>
  </header>
  <section class="how panel">
    <span class="eyebrow">The 8-point order you’ll be graded against</span>
    <ol class="order">${TILES.map(t=>`<li>${t.name}</li>`).join("")}</ol>
    <p>Each case has one or two findings that crack it. Some cases have a step that would hurt the patient. Check the whole exam when it’s safe; it earns a completeness mark. Two exceptions change the order: stroke in the thrombolytic window, and a contraindication like a possible open globe.</p>
    <a class="textlink" href="#/exam">How to do each step</a>
  </section>
  <div class="mode">
    <input type="checkbox" id="hardmode" ${hard?"checked":""}>
    <label for="hardmode"><strong>Senior hard mode</strong><small>Three exam parts only before you call ophthalmology. Pick the ones that matter.</small></label>
  </div>
  ${groups}
  <footer class="foot">
    <span>Built from the 8-Point Eye Exam handout (September 2026) and the Eye Emergencies lecture handouts.</span>
    <span>Clinical teaching cases. Follow local protocols and consultant guidance.</span>
  </footer>`;
  app.querySelectorAll(".case-card").forEach(b=>b.addEventListener("click",()=>nav("case/"+b.dataset.case)));
  document.getElementById("hardmode").addEventListener("change",e=>{hard=e.target.checked;store.set("eyecb-hard",hard);});
  removeBar();
  window.scrollTo(0,0);
}

function openCase(id){
  const c = CASES.find(x=>x.id===id);
  S = {c, opened:[], order:[], harmed:[], extraDone:false, strokeAt:null, delayed:[], checkin:null, checkinShown:false, committed:false, answers:[], hard};
  renderCase();
  window.scrollTo(0,0);
}

function tileHTML(t,i){
  const c=S.c, open=S.opened.includes(t.k), harmMsg = c.harm && c.harm[t.k];
  const limit = S.hard && S.opened.length>=3 && !open;
  const locked = S.committed || limit;
  let body = `<span class="t-top"><span class="t-n">${i+1}</span><span class="t-name">${t.name}</span></span><span class="t-sub">${t.sub}</span>`;
  let cls="tile";
  if(open){
    cls+=" open"; if(S.fresh===t.k) cls+=" fresh";
    if(harmMsg){ cls+=" harm"; body+=`<div class="finding"><b>${esc(harmMsg)}</b></div>`; }
    else{
      body+=`<div class="finding">${c.f[t.k]}</div>`;
      const im = c.fimg && c.fimg[t.k];
      if(im) body+=`<img src="${IMG[im.src]}" alt="${esc(im.alt)}">`;
      if(c.delay && c.delay.includes(t.k) && S.delayed.includes(t.k)) body+=`<div class="note warn">${esc(c.delayNote)}</div>`;
      const ex = c.extra && c.extra[t.k];
      if(ex){
        if(S.extraDone) body+=`<div class="note bad"><b>${esc(ex.harm)}</b></div>`;
        else if(!S.committed) body+=`<button class="mini" data-extra="${t.k}">${esc(ex.label)}</button>`;
      }
    }
  }
  if(open) return `<div class="${cls}">${body}</div>`;
  return `<button class="${cls}" data-tile="${t.k}" aria-label="${esc(t.name)}: tap to examine" ${locked?'aria-disabled="true"':''}>${body}</button>`;
}

function renderCase(){
  const c=S.c, tc=TRACKS[c.track].color;
  const idx = CASES.indexOf(c);
  let strokeHTML="";
  if(c.stroke){
    strokeHTML = `<div class="row-actions"><button class="stroke" id="strokeBtn" ${S.strokeAt!==null||S.committed?"disabled":""}>Activate stroke team?</button></div>`;
    if(S.strokeAt!==null) strokeHTML += `<div class="note ${c.stroke.role==="no"?"":"good"}">${esc(c.stroke.msg)}</div>`;
  }
  let checkin="";
  if(S.checkinShown && S.checkin===null && !S.committed){
    checkin = `<div class="checkin" id="checkin"><p>Quick check: what’s your leading diagnosis right now?</p><div class="pills">${c.qs[0].o.map((o,i)=>`<button class="pill" data-ci="${i}">${esc(o)}</button>`).join("")}<button class="pill ghost" data-ci="-1">Skip</button></div></div>`;
  }
  const limitNote = (S.hard && S.opened.length>=3 && !S.committed) ? `<div class="note warn">Hard mode: you’ve used your three exam parts. Make the call.</div>` : "";
  app.innerHTML = `
  <div class="topbar"><button class="back" id="backBtn">← All cases</button><span class="where">Case ${c.id} of 9${S.hard?" · Hard mode":""}</span></div>
  <div style="--tc:${tc}">
    <header class="case-head"><span class="eyebrow">Case ${c.id} · ${TRACKS[c.track].name}${c.level==="Senior bonus"?" · Senior bonus":""}</span><h2>${c.cc}</h2></header>
    <div class="triage"><div class="eyebrow">Triage note</div><p>${esc(c.triage)}</p></div>
    ${strokeHTML}
    <div class="section-label"><h3>Examine</h3><span class="count">${S.opened.length} of 8 checked</span></div>
    ${checkin}${limitNote}
    <div class="tiles">${TILES.map(tileHTML).join("")}</div>
    <div id="qzone">${S.committed?questionsHTML():""}</div>
  </div>`;
  document.getElementById("backBtn").onclick=home;
  const sb=document.getElementById("strokeBtn"); if(sb) sb.onclick=()=>{ S.strokeAt=S.opened.length; renderCase(); };
  app.querySelectorAll("[data-tile]").forEach(b=>b.addEventListener("click",()=>tap(b.dataset.tile)));
  app.querySelectorAll("[data-extra]").forEach(x=>x.addEventListener("click",()=>{
    S.extraDone=true; S.fresh=null; if(!S.harmed.includes("pocus")) S.harmed.push("pocus");
    const y=window.scrollY; renderCase(); window.scrollTo(0,y);
  }));
  app.querySelectorAll("[data-ci]").forEach(b=>b.addEventListener("click",()=>{ S.checkin=+b.dataset.ci; S.fresh=null; const y=window.scrollY; renderCase(); window.scrollTo(0,y); }));
  app.querySelectorAll("[data-q]").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.q,+b.dataset.o)));
  const nx=document.getElementById("nextBtn"); if(nx) nx.onclick=()=>{ const n=CASES[(idx+1)%CASES.length]; nav("case/"+n.id); };
  const rb=document.getElementById("retryBtn"); if(rb) rb.onclick=()=>openCase(c.id);
  const hb=document.getElementById("homeBtn"); if(hb) hb.onclick=home;
  renderBar();
}

function tap(k){
  if(S.committed) return;
  if(S.opened.includes(k)) return;
  if(S.hard && S.opened.length>=3) return;
  S.opened.push(k); S.fresh=k;
  const c=S.c;
  if(c.harm && c.harm[k]) S.harmed.push(k);
  if(c.delay && c.delay.includes(k) && S.strokeAt===null) S.delayed.push(k);
  if(S.opened.length===3 && !S.checkinShown){ S.checkinShown=true; }
  const y=window.scrollY; renderCase(); window.scrollTo(0,y);
}

function removeBar(){ const b=document.getElementById("callbar"); if(b) b.remove(); }
function renderBar(){
  removeBar();
  if(!S || S.committed) return;
  const bar=document.createElement("div"); bar.className="callbar"; bar.id="callbar";
  bar.innerHTML=`<div class="inner"><span>Ready? Commit to a diagnosis and next step.</span><button class="primary" id="callBtn" ${S.opened.length?"":"disabled"}>Make the call</button></div>`;
  document.body.appendChild(bar);
  document.getElementById("callBtn").onclick=()=>{
    S.committed=true; S.fresh=null; S.freshQ=0; if(S.checkin===null) S.checkin=-1;
    renderCase();
    const q=document.getElementById("qzone"); if(q) q.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"start"});
  };
}

function questionsHTML(){
  const c=S.c; let html="";
  for(let i=0;i<c.qs.length;i++){
    if(i>S.answers.length) break;
    const q=c.qs[i], picked=S.answers[i];
    const done = picked!==undefined;
    html += `<div class="q${S.freshQ===i?" fresh":""}"><span class="eyebrow">${q.senior?"Senior follow-up":"Question "+(i+1)}</span><h3>${esc(q.q)}</h3><div class="opts">${q.o.map((o,j)=>{
      let cls="opt"; if(done){ if(j===q.a) cls+=" right"; else if(j===picked) cls+=" wrong"; else cls+=" dim"; }
      return `<button class="${cls}" data-q="${i}" data-o="${j}" ${done?"disabled":""}><span class="k">${LETTERS[j]}</span><span>${esc(o)}</span></button>`;}).join("")}</div>`;
    if(done){
      const right = picked===q.a;
      const fb = q.fb && q.fb[picked];
      html += `<div class="note ${right?"good":"bad"}"><b>${right?"Correct.":"Not quite."}</b> ${esc(fb||q.why||"")}${!right?` The answer is ${LETTERS[q.a]}.`:""}</div>`;
    }
    html += `</div>`;
  }
  if(S.answers.length===c.qs.length) html += debriefHTML();
  return html;
}

function answer(i,o){
  if(S.answers[i]!==undefined) return;
  S.answers[i]=o; S.fresh=null; S.freshQ=i+1;
  if(S.answers.length===S.c.qs.length){
    const right=S.c.qs.filter((q,j)=>S.answers[j]===q.a).length;
    results[S.c.id]={right,total:S.c.qs.length}; store.set("eyecb-results",results);
  }
  const y=window.scrollY; renderCase(); window.scrollTo(0,y);
}

function debriefHTML(){
  const c=S.c, items=[];
  const name=k=>TILES.find(t=>t.k===k).name;
  if(c.hinge.length){
    c.hinge.forEach(k=>{
      items.push(S.opened.includes(k)
        ? `<li><span class="mark ok">✓</span><span>You checked <b>${name(k)}</b>, one of the findings that cracks this case.</span></li>`
        : `<li><span class="mark no">✕</span><span>You didn’t check <b>${name(k)}</b>. That finding cracks this case.</span></li>`);
    });
  } else {
    items.push(`<li><span class="mark mid">i</span><span>${esc(c.noHingeNote)}</span></li>`);
  }
  S.harmed.forEach(k=>{
    const msg = k==="pocus" ? "You ordered ocular ultrasound on a possible open globe." : `You checked <b>${name(k)}</b> on a possible open globe.`;
    items.push(`<li><span class="mark no">!</span><span>${msg} In a real patient, that step could cause harm.</span></li>`);
  });
  if(c.stroke && c.stroke.role==="correct"){
    if(S.strokeAt===null) items.push(`<li><span class="mark no">✕</span><span>You never activated the stroke team.</span></li>`);
    else if(S.delayed.length) items.push(`<li><span class="mark mid">!</span><span>You activated, but only after ${S.delayed.map(name).join(", ")}. The rapid screen was enough; those could wait.</span></li>`);
    else items.push(`<li><span class="mark ok">✓</span><span>You activated the stroke team after the rapid screen. That’s the move.</span></li>`);
  }
  if(c.stroke && c.stroke.role==="ok" && S.strokeAt!==null) items.push(`<li><span class="mark ok">✓</span><span>You engaged the stroke/TIA pathway.</span></li>`);
  const safe = TILES.map(t=>t.k).filter(k=>!(c.harm && c.harm[k]));
  const got = safe.filter(k=>S.opened.includes(k)).length;
  if(S.hard) items.push(`<li><span class="mark mid">3</span><span>Hard mode picks: ${S.opened.map(name).join(", ")}.</span></li>`);
  else if(got===safe.length) items.push(`<li><span class="mark ok">✓</span><span>Complete exam: all ${safe.length} safe parts checked.</span></li>`);
  else items.push(`<li><span class="mark mid">${got}</span><span>${got} of ${safe.length} safe exam parts checked.</span></li>`);
  if(S.checkin!==null && S.checkin>=0){
    const ok=S.checkin===c.qs[0].a;
    items.push(`<li><span class="mark ${ok?"ok":"mid"}">${ok?"✓":"?"}</span><span>Your early call after three parts: ${esc(c.qs[0].o[S.checkin])}.</span></li>`);
  }
  const img = c.img ? `<figure><img src="${IMG[c.img.src]}" alt="${esc(c.img.cap)}"><figcaption>${esc(c.img.cap)}</figcaption></figure>` : "";
  return `<section class="debrief${S.freshQ===c.qs.length?" fresh":""}" style="--tc:${TRACKS[c.track].color}">
    <span class="eyebrow">Debrief · Case ${c.id}</span>
    <h3>${esc(c.qs[0].o[c.qs[0].a])}</h3>
    <ul class="checks">${items.join("")}</ul>
    <div class="teach"><p><span class="lbl">Teaching point.</span> ${esc(c.teach)}</p>${c.pearl?`<p><span class="lbl">${esc(c.pearlLabel||"Senior pearl.")}</span> ${esc(c.pearl)}</p>`:""}</div>
    ${img}
    ${reviewHTML(c)}
    <p class="src">Source: ${esc(c.source)}</p>
    <div class="next-row"><button class="primary" id="nextBtn" style="margin-left:0">Next case →</button><button class="secondary" id="retryBtn">Try again</button><button class="secondary" id="homeBtn">All cases</button></div>
  </section>`;
}

let railObs = null;
function route(){
  if(railObs){ railObs.disconnect(); railObs = null; }
  removeBar(); S = null;
  const h = location.hash.replace(/^#\/?/, "");
  const parts = h.split("/");
  if(parts[0] === "cases"){ casesHome(); document.title = "Cases · Eye Exam Casebook"; }

  else if(parts[0] === "exam"){ examPage(parts[1]); document.title = "8-Point Exam · Eye Exam Casebook"; }

function practiceHTML(k, cs, label){
  cs = cs || CASES.filter(c=>c.hinge && c.hinge.includes(k));
  if(!cs.length) return "";
  return `<div class="blk"><p class="blk-h">${label||"Cases where this step is key"}</p>
    <div class="prac">${cs.map(c=>`<a class="pc" href="#/case/${c.id}" style="--tc:${TRACKS[c.track].color}"><span class="n">Case ${c.id} · ${TRACKS[c.track].name}</span><span class="c">${c.cc}</span></a>`).join("")}</div></div>`;
}

function stepHTML(s,i){
  const pits = s.pitfalls || (s.pitfall ? [s.pitfall] : []);
  const pitHTML = !pits.length ? "" : pits.length===1
    ? `<div class="callout pit"><span class="ch">Pitfall</span><span>${pits[0]}</span></div>`
    : `<div class="callout pit"><span class="ch">Pitfalls</span><ul>${pits.map(p=>`<li>${p}</li>`).join("")}</ul></div>`;
  return `<section class="step" id="s-${s.k}">
    <header class="step-head"><span class="step-num">${i+1}</span><h2>${s.title}</h2></header>
    <p class="why">${s.why}</p>
    ${s.stop||""}
    ${s.how?`<div class="blk"><p class="blk-h">How to do it</p><ul class="dolist">${s.how.map(h=>`<li>${h}</li>`).join("")}</ul></div>`:""}
    ${s.video?`<a class="vid" href="${s.video.url}" target="_blank" rel="noopener"><span class="play" aria-hidden="true"></span><span><span class="vt">Watch: ${s.video.title}</span><span class="vs">${s.video.src}</span></span></a>`:""}
    ${s.extra||""}

    ${pitHTML}
    ${practiceHTML(s.k)}
  </section>`;
}

    <h2>Kids</h2>
    <ul class="dolist">
      <li>Functional vision may be the only acuity you get: <b>fix-and-follow</b> in infants, picture charts in toddlers, Snellen by school age.</li>
      <li>Use distraction, a parent’s lap, and short focused attempts. Cooperation is rarely sustained.</li>
      <li>Procedural sedation may be needed for an adequate exam in suspected open globe or significant trauma.</li>
      <li>Keep a low threshold for ophthalmology. Pediatric exams are limited, and missed disease can affect visual development.</li>
    </ul>
  </section>

  <section class="part" id="x-doc">
    <h2>Charting</h2>
    <p>Document what you found, and say <b>why</b> you deferred anything (for example, “IOP deferred, open globe suspected”). Include consults, recommendations, and disposition.</p>
    <div class="tplwrap"><pre class="tpl" id="tpl">${esc(DOC_TEMPLATE)}</pre><button class="copy" id="copyTpl">Copy template</button></div>
  </section>

  <details class="refs"><summary>References</summary><ol>${REFS.map(([t,u])=>`<li>${esc(t)} <a href="${u}" target="_blank" rel="noopener">Link</a></li>`).join("")}</ol></details>

  <footer class="foot">
    <span>From the 8-Point Eye Exam handout, Jonathan Dangers, MD, MPH.</span>
    <span>Clinical teaching material. Follow local protocols and consultant guidance.</span>
  </footer>`;

  // in-page jumps without breaking the hash route
  app.querySelectorAll("[data-jump]").forEach(a=>a.addEventListener("click",e=>{
    e.preventDefault(); jumpTo(a.dataset.jump);
  }));
  const cb = document.getElementById("copyTpl");
  cb.onclick = async ()=>{
    try{ await navigator.clipboard.writeText(DOC_TEMPLATE); cb.textContent="Copied"; }
    catch(e){ const r=document.createRange(); r.selectNodeContents(document.getElementById("tpl")); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); cb.textContent="Selected. Copy it now"; }
    setTimeout(()=>{cb.textContent="Copy template";},2200);
  };
  // highlight the rail item for the section on screen
  const links = [...app.querySelectorAll(".rail a")];
  const rail = app.querySelector(".rail");
  railObs = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(!en.isIntersecting) return;
      links.forEach(l=>{
        const on = l.dataset.jump===en.target.id; l.classList.toggle("on",on);
        if(on){ const x=l.offsetLeft - rail.clientWidth/2 + l.clientWidth/2; rail.scrollTo({left:x,behavior:"auto"}); }
      });
    });
  },{rootMargin:"-120px 0px -60% 0px"});
  app.querySelectorAll(".step,.part,.stopblock").forEach(s=>railObs.observe(s));
  window.scrollTo(0,0);
  if(target){ const id = EXAM.some(s=>s.k===target) ? "s-"+target : "x-"+target; requestAnimationFrame(()=>jumpTo(id,true)); }
}
function jumpTo(id,instant){
  const el=document.getElementById(id); if(!el) return;
  const smooth = !instant && !matchMedia("(prefers-reduced-motion: reduce)").matches;
  el.scrollIntoView({behavior:smooth?"smooth":"auto",block:"start"});
}

/* Debrief cross-link back into the exam guide */
function reviewHTML(c){
  if(!c.hinge || !c.hinge.length) return "";
  return `<div class="review"><span>Review in the exam guide:</span>${c.hinge.map(k=>{const i=TILES.findIndex(t=>t.k===k); return `<a href="#/exam/${k}"><span class="rn">${i+1}</span>${TILES[i].name}</a>`;}).join("")}</div>`;
}

route();
</script>
